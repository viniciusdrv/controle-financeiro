<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>Controle Financeiro</title>

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon.svg">

<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --card2:#f7f8fa; --text:#0f172a; --muted:#64748b; --line:#e6e9ee;
  --brand:#0f766e; --brand-soft:#e0f2ef; --on-brand:#ffffff;
  --pos:#15803d; --neg:#dc2626; --warn:#c2410c;
  --pos-soft:#e8f6ec; --neg-soft:#fdecec; --warn-soft:#fff3e6;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --shadow-up:0 8px 30px rgba(15,23,42,.12);
  --hero1:#0f766e; --hero2:#134e4a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e13; --card:#141922; --card2:#1a202b; --text:#e8edf4; --muted:#8b97a8; --line:#232a36;
    --brand:#2dd4bf; --brand-soft:#11302d; --on-brand:#042f2b;
    --pos:#4ade80; --neg:#f87171; --warn:#fb923c;
    --pos-soft:#10291b; --neg-soft:#331717; --warn-soft:#33210f;
    --shadow:0 1px 0 rgba(255,255,255,.02); --shadow-up:0 8px 30px rgba(0,0,0,.5);
    --hero1:#0f5f58; --hero2:#0d2f2c;
  }
}
/* tema escolhido à mão nos Ajustes (data-theme no <html>) */
:root{color-scheme:light}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){color-scheme:dark} }
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0e13; --card:#141922; --card2:#1a202b; --text:#e8edf4; --muted:#8b97a8; --line:#232a36;
  --brand:#2dd4bf; --brand-soft:#11302d; --on-brand:#042f2b;
  --pos:#4ade80; --neg:#f87171; --warn:#fb923c;
  --pos-soft:#10291b; --neg-soft:#331717; --warn-soft:#33210f;
  --shadow:0 1px 0 rgba(255,255,255,.02); --shadow-up:0 8px 30px rgba(0,0,0,.5);
  --hero1:#0f5f58; --hero2:#0d2f2c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button,input,select,textarea{font:inherit;color:inherit}
.ico{display:block;flex:0 0 auto}
.wrap{max-width:760px;margin:0 auto;padding:4px 16px calc(110px + env(safe-area-inset-bottom))}

/* topo */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:760px;margin:0 auto}
header.top .logo{width:30px;height:30px;border-radius:9px;flex:0 0 auto}
header.top h1{font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
header.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.iconbtn{border:0;background:var(--card);color:var(--text);width:38px;height:38px;display:grid;place-items:center;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn:hover{background:var(--card2)}
.iconbtn.plain{background:transparent;box-shadow:none}

/* cartões e seções */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2,.sec-t{font-size:15px;margin:0 0 12px;font-weight:650;letter-spacing:-.01em;color:var(--text)}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px} .h2row h2{margin:0}
.h2row .sub{font-size:12.5px;color:var(--muted);font-weight:500}

/* destaque do saldo */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 16px;margin:4px 0 14px;color:#fff;background:linear-gradient(140deg,var(--hero1),var(--hero2));box-shadow:0 10px 30px rgba(15,118,110,.25)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.hero .l{font-size:13px;opacity:.8;font-weight:500}
.hero .v{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px;line-height:1.15}
.hero .pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600}
.hero .pill i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.hero .pill.warn i{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.25)} .hero .pill.bad i{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.3)}
.hero .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.hero .grid span{display:block;font-size:11.5px;opacity:.75} .hero .grid b{display:block;font-size:14.5px;font-weight:650;margin-top:1px;white-space:nowrap}

/* indicadores */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px} .kpi .v{font-size:18px;font-weight:700;margin-top:3px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.big{grid-column:1/-1} .kpi.big .v{font-size:24px}
.kpi.link{cursor:pointer} .kpi.link:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)} .kpi.big{grid-column:span 2}}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;margin-bottom:12px;font-weight:550;font-size:14px}
.alert.ok{background:var(--pos-soft);color:var(--pos)} .alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.bad{background:var(--neg-soft);color:var(--neg)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .small{font-size:12.5px}

/* listas */
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .d{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.item .d .tx{overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.item .val{font-weight:650;white-space:nowrap;text-align:right}
.item .val small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--muted);flex:0 0 auto}
.badge.Programado{background:var(--brand-soft);color:var(--brand)} .badge.Previsão{background:var(--warn-soft);color:var(--warn)}
.paybtn{border:1px solid var(--line);background:var(--card);color:var(--pos);border-radius:50%;width:34px;height:34px;padding:0;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.item .s .badge{margin-right:6px;vertical-align:1px}
.paybtn:hover{background:var(--pos-soft);border-color:transparent}
.grouph{font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 4px 6px;display:flex;justify-content:space-between}
.grouph:first-child{margin-top:4px}

/* botões e formulários */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:650;cursor:pointer;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)} .btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
label.f{display:block;margin-bottom:12px} label.f span{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:5px}
input.i,select.i,textarea.i{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--card);font-size:16px;appearance:none;-webkit-appearance:none}
select.i{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.valorbox{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 14px}
.valorbox span{font-size:20px;font-weight:600;color:var(--muted)}
.valor{border:0!important;background:transparent!important;box-shadow:none!important;font-size:40px!important;font-weight:700;text-align:center;width:220px!important;padding:0!important;letter-spacing:-.02em}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.lbl{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:5px}

/* menu inferior */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;width:calc(100% - 24px);max-width:480px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-up);display:flex;align-items:center;padding:6px}
nav.tabs button{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px}
nav.tabs button.on{color:var(--brand);font-weight:650}
nav.tabs button.add{flex:0 0 auto;width:56px;height:56px;margin:-22px 6px 0;border-radius:18px;background:var(--brand);color:var(--on-brand);box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 45%,transparent);justify-content:center}
nav.tabs button.add:hover{filter:brightness(1.06)}

/* navegação de mês, chips, barras */
.monthnav{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.monthnav strong{flex:1;text-align:center;font-size:16px;font-weight:650}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.searchbox{position:relative;margin-bottom:10px} .searchbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)} .searchbox input{padding-left:40px}
.bars .b{margin-bottom:12px} .bars .b:last-child{margin-bottom:0}
.bars .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px}
.bars .t span{display:flex;align-items:center;gap:8px;font-weight:500} .bars .t i{width:8px;height:8px;border-radius:3px;background:var(--c,var(--brand));flex:0 0 auto}
.bars .t b{font-weight:650;white-space:nowrap}
.bars .track{height:6px;background:var(--card2);border-radius:99px;overflow:hidden} .bars .fill{height:100%;background:var(--c,var(--brand));border-radius:99px}
.bars .fill.warn{background:var(--warn)} .bars .fill.bad{background:var(--neg)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap} table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
table.t tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;margin:0 -4px}
.chartbox{position:relative;height:210px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:-4px 0 8px}
.legend span{display:flex;align-items:center;gap:6px} .legend i{width:14px;height:3px;border-radius:2px;background:var(--brand)} .legend i.d{background:repeating-linear-gradient(90deg,var(--brand) 0 4px,transparent 4px 7px)}

/* janelas */
.sheet-bg{position:fixed;inset:0;background:rgba(8,12,18,.45);backdrop-filter:blur(2px);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:26px;padding-top:18px}.sheet::before{display:none}}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:.6}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:30;font-weight:600;font-size:14px;max-width:90vw;text-align:center;box-shadow:var(--shadow-up)}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.demo-banner{display:flex;align-items:center;justify-content:center;gap:8px;max-width:728px;margin:10px auto 0;background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:8px 12px;border-radius:12px;font-weight:600;text-align:center}
@media (max-width:760px){.demo-banner{margin:10px 16px 0}}
.chk{display:flex;align-items:center;gap:8px;margin:2px 0 10px;cursor:pointer;font-weight:600}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);flex:0 0 auto}
input.mini{width:108px;padding:8px 10px;font-size:15px;text-align:right;flex:0 0 auto}
.item.off{opacity:.45}
/* ===== layout de computador (telas largas); no celular nada disso se aplica ===== */
.side{display:none}
@media (min-width:1024px){
  nav.tabs{display:none}
  .app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--card)}
  .side .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:15.5px;letter-spacing:-.01em;margin:0 8px 24px}
  .side .brand img{width:36px;height:36px;border-radius:11px}
  .side .novo{margin:0 0 20px}
  .side .navi{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);font-weight:550;font-size:14.5px;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:left;width:100%}
  .side .navi:hover{background:var(--card2);color:var(--text)}
  .side .navi.on{background:var(--brand-soft);color:var(--brand);font-weight:650}
  .side .rodape{margin-top:auto;font-size:12px;line-height:1.5;color:var(--muted);padding:12px 10px 0;border-top:1px solid var(--line)}
  .side .rodape kbd{font:600 11px Inter,system-ui;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card2)}
  .content{min-width:0}
  header.top{max-width:1220px;padding:26px 36px 12px}
  header.top .logo{display:none}
  header.top h1{font-size:25px} header.top h1 small{font-size:13px;margin-top:2px}
  .wrap{max-width:1220px;padding:8px 36px 48px}
  .demo-banner{max-width:none;margin:16px 36px 0}
  .dash{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
  .dash.lista{grid-template-columns:330px minmax(0,1fr)}
  .dash.lista .col-a{position:sticky;top:96px}
  .dash.lista .chips{flex-wrap:wrap;overflow:visible}
  .dash.lista .monthnav{margin-top:0}
  .grouph:first-child{margin-top:0}
  .card{padding:20px} .hero{padding:26px 26px 20px} .hero .v{font-size:42px}
  .chartbox{height:270px}
  .toast{bottom:28px}
}
.login{max-width:380px;margin:0 auto;min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.login img{width:68px;height:68px;border-radius:20px;box-shadow:0 10px 30px rgba(15,118,110,.3)}
.login h1{margin:4px 0 0;font-size:24px;letter-spacing:-.02em}
</style>

<body>
<div id="root"></div>
<script>
/* ============================================================
   CONFIGURAÇÃO — cole aqui o "ID do aplicativo (cliente)" do
   registro no portal da Microsoft (veja LEIA-ME.md).
   Se ficar vazio, o app pede o ID na primeira vez.
   ============================================================ */
const CLIENT_ID = '5f1e7927-b93f-4d16-9d87-628370dd7e12';
const FILE_PATH = '/PESSOAL/Controle Financeiro.xlsx';
const TABLE_NAME = 'Tabela1';

const TIPOS = ['Saída','Entrada','Investimento','Retirada'];
const FORMAS = ['Débito','Cartão','Conta','Dinheiro'];
const STATUS = ['Pago','Programado','Previsão'];
const CATEGORIAS = ['Alimentação','Animais','Assinaturas','Cartão','Combustível','Cuidados Pessoais','Diversos','Educação','Investimento','Lazer','Moradia','Renda','Repasses','Saúde','Telefonia'];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_LONGO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pad = n => String(n).padStart(2,'0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoLocal(new Date());
const fmtData = iso => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}` : '';
const fmtDataLonga = iso => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}` : '';
const ym = iso => iso.slice(0,7);
const serialToIso = s => { const d = new Date(Date.UTC(1899,11,30) + Math.round(Number(s))*864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const isoToSerial = iso => { const [y,m,d] = iso.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d) - Date.UTC(1899,11,30))/864e5); };
const normTipo = t => t === 'Saida' ? 'Saída' : t;
const sinal = t => (t === 'Entrada' || t === 'Retirada') ? 1 : -1; // mesma regra da planilha
function parseValor(v){
  v = String(v||'').trim().replace(/[R$\s]/g,'');
  if (v.includes(',')) v = v.replace(/\./g,'').replace(',','.');
  const n = parseFloat(v); return isNaN(n) ? NaN : Math.round(n*100)/100;
}
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }

/* ---------------- Microsoft Graph ---------------- */
let msalApp = null, itemId = null;
const SCOPES = ['Files.ReadWrite'];
function clientId(){ return CLIENT_ID || lsGet('cf_clientId') || ''; }

async function initMsal(){
  msalApp = new msal.PublicClientApplication({
    auth:{ clientId: clientId(), authority:'https://login.microsoftonline.com/consumers', redirectUri: location.origin + location.pathname },
    cache:{ cacheLocation:'localStorage' }
  });
  await msalApp.initialize();
  const res = await msalApp.handleRedirectPromise();
  if (res && res.account) msalApp.setActiveAccount(res.account);
  else { const a = msalApp.getAllAccounts(); if (a.length) msalApp.setActiveAccount(a[0]); }
  return !!msalApp.getActiveAccount();
}
function erroOffline(){ return Object.assign(new Error('Sem conexão com a internet'), { offline:true }); }
const isOffline = e => !!(e && (e.offline || !navigator.onLine));
async function token(){
  const account = msalApp.getActiveAccount();
  try { return (await msalApp.acquireTokenSilent({ scopes:SCOPES, account })).accessToken; }
  catch(e){
    if (!navigator.onLine || /network|endpoints_resolution/i.test(e.errorCode || '')) throw erroOffline();
    await msalApp.acquireTokenRedirect({ scopes:SCOPES, account }); throw new Error('Redirecionando para login…');
  }
}
async function graph(method, path, body, tentativa=0){
  const tk = await token();
  let r;
  try {
    r = await fetch('https://graph.microsoft.com/v1.0' + path, {
      method, headers:{ Authorization:'Bearer ' + tk, 'Content-Type':'application/json' },
      body: body ? JSON.stringify(body) : (method === 'POST' ? '{}' : undefined)
    });
  } catch(e){ throw erroOffline(); }
  if ((r.status === 429 || r.status >= 500) && tentativa < 2){ await new Promise(ok=>setTimeout(ok, 1200*(tentativa+1))); return graph(method, path, body, tentativa+1); }
  if (!r.ok){ let m = r.status + ''; try{ const j = await r.json(); m = j.error?.message || m; }catch(e){} throw new Error(m); }
  return r.status === 204 ? null : r.json();
}

/* Lê a Tabela1 inteira e separa linhas preenchidas e vazias */
async function carregarGraph(){
  const res = await graph('GET', `${await wb()}/tables('${TABLE_NAME}')/range?$select=address,values`);
  const [sheet, ref] = res.address.split('!');
  S.sheetName = sheet.replace(/^'|'$/g,'');
  const firstRow = parseInt(ref.match(/\d+/)[0], 10);
  const vals = res.values;
  const head = vals[0].map(h => String(h).trim());
  const ix = n => head.indexOf(n);
  const c = { data:ix('Data'), desc:ix('Descrição'), cat:ix('Categoria'), tipo:ix('Tipo'), forma:ix('Forma'), status:ix('Status'), valor:ix('Valor'), obs:ix('Obs'), rec:ix('Recorrência') };
  S.colRec = c.rec >= 0 ? String.fromCharCode(65 + c.rec) : null; // letra da coluna "Recorrência" (K)
  if (c.data !== 0 || c.valor !== 6 || c.obs !== 8) throw new Error('A estrutura da Tabela1 mudou (colunas esperadas: Data…Valor em A–G, Obs em I).');
  const rows = [], empty = [];
  for (let i = 1; i < vals.length; i++){
    const v = vals[i], rowNum = firstRow + i;
    const vazio = v[c.data] === '' && v[c.desc] === '' && v[c.valor] === '';
    if (vazio){ empty.push(rowNum); continue; }
    rows.push({
      row: rowNum,
      data: typeof v[c.data] === 'number' ? serialToIso(v[c.data]) : '',
      desc: String(v[c.desc]), cat: String(v[c.cat]), tipo: String(v[c.tipo]), forma: String(v[c.forma]),
      status: String(v[c.status]), valor: Number(v[c.valor]) || 0, obs: String(v[c.obs] ?? ''),
      rec: c.rec >= 0 ? String(v[c.rec] ?? '') : ''
    });
  }
  S.rows = rows; S.emptyRows = empty;
  await carregarLimites();
  S.offlineDesde = null;
  lsSet('cf_cache', JSON.stringify({ t: Date.now(), rows, emptyRows: empty, sheetName: S.sheetName, limites: S.limites, limitesRow: S.limitesRow }));
  aplicarFila();
}
/* Grava vários lançamentos novos nas primeiras linhas vazias (em blocos contínuos) */
async function gravarVarias(lista){
  await carregarGraph(); // estado mais recente, para não sobrescrever nada
  if (S.emptyRows.length < lista.length) throw new Error(`A Tabela1 só tem ${S.emptyRows.length} linha(s) livre(s). Abra a planilha e aumente a tabela (arraste o canto inferior).`);
  const alvo = S.emptyRows.slice(0, lista.length);
  const base = `${await wb()}/worksheets('${encodeURIComponent(S.sheetName)}')`;
  for (let i = 0; i < alvo.length; ){
    let j = i; while (j + 1 < alvo.length && alvo[j+1] === alvo[j] + 1) j++;
    const parte = lista.slice(i, j + 1), ini = alvo[i], fim = alvo[j];
    await graph('PATCH', `${base}/range(address='A${ini}:G${fim}')`, { values: parte.map(l => linhaParaValores(l)[0]) });
    if (parte.some(l => l.obs)) await graph('PATCH', `${base}/range(address='I${ini}:I${fim}')`, { values: parte.map(l => [l.obs || '']) });
    if (S.colRec && parte.some(l => l.rec)) await graph('PATCH', `${base}/range(address='${S.colRec}${ini}:${S.colRec}${fim}')`, { values: parte.map(l => [l.rec || '']) });
    i = j + 1;
  }
  await carregarGraph();
}

const CATS_LIMITE = CATEGORIAS.filter(c => !['Renda','Investimento','Cartão'].includes(c));
async function carregarLimites(){
  try {
    const res = await graph('GET', `${await wb()}/worksheets('Limites')/range(address='A1:B60')?$select=values`);
    const lim = {}, pos = {};
    res.values.forEach((v, i) => {
      const c = String(v[0]).trim(); if (i === 0 || !c) return;
      pos[c] = i + 1; const n = Number(v[1]); if (v[1] !== '' && n > 0) lim[c] = n;
    });
    S.limites = lim; S.limitesRow = pos; S.limitesOk = true;
  } catch(e){ if (isOffline(e)) throw e; S.limites = {}; S.limitesRow = {}; S.limitesOk = false; }
}
async function criarAbaLimites(){
  const w = await wb(), n = CATS_LIMITE.length, fim = n + 1, T = 'Timeline!';
  await graph('POST', `${w}/worksheets/add`, { name: 'Limites' });
  const mes = `${T}$A$2:$A$581,">="&(EOMONTH(TODAY(),-1)+1),${T}$A$2:$A$581,"<="&EOMONTH(TODAY(),0)`;
  const formulas = [['Categoria','Limite mensal','Previsto no mês atual','Disponível'],
    ...CATS_LIMITE.map((c, i) => { const r = i + 2; return [c, '', `=SUMIFS(${T}$G$2:$G$581,${T}$D$2:$D$581,"Saída",${T}$J$2:$J$581,$A${r},${mes})`, `=IF(B${r}="","",B${r}-C${r})`]; })];
  const base = `${w}/worksheets('Limites')`;
  await graph('PATCH', `${base}/range(address='A1:D${fim}')`, { formulas });
  await graph('PATCH', `${base}/range(address='B2:D${fim}')`, { numberFormat: Array.from({ length: n }, () => Array(3).fill('"R$" #,##0.00')) });
  await graph('PATCH', `${base}/range(address='A1:D1')/format/font`, { bold: true });
  try { await graph('POST', `${base}/range(address='A1:D${fim}')/format/autofitColumns`); } catch(e){}
}
async function gravarLimites(valores){ // valores: { categoria: número ou '' }
  const linhas = Object.values(S.limitesRow); if (!linhas.length) return;
  const ini = Math.min(...linhas), fim = Math.max(...linhas);
  const porLinha = Object.fromEntries(Object.entries(S.limitesRow).map(([c, r]) => [r, c]));
  const values = []; for (let r = ini; r <= fim; r++){ const c = porLinha[r]; values.push([c && valores[c] !== undefined ? valores[c] : (c && S.limites[c] ? S.limites[c] : '')]); }
  await graph('PATCH', `${await wb()}/worksheets('Limites')/range(address='B${ini}:B${fim}')`, { values });
  await carregarLimites();
}

async function inserirNovos(lista){
  if (S.mode !== 'graph'){ let m = Math.max(1, ...S.rows.map(r => r.row)); lista.forEach(l => S.rows.push({ row: ++m, ...l })); return false; }
  try { await gravarVarias(lista); return false; }
  catch(e){ if (!isOffline(e)) throw e; setFila(fila().concat(lista)); aplicarFila(); return true; }
}

/* ---------------- cálculos (mesmas regras do Dashboard) ---------------- */
function calcular(){
  const hoje = today();
  const validos = S.rows.filter(r => r.data);
  // saldo projetado: ordem por data e, no mesmo dia, pela ordem da linha
  const ord = [...validos].sort((a,b) => a.data === b.data ? a.row - b.row : (a.data < b.data ? -1 : 1));
  let acc = 0;
  for (const r of ord){ if (r.status !== 'Marco zero') acc += sinal(r.tipo) * r.valor; r.saldo = Math.round(acc*100)/100; }
  const conta = validos.filter(r => r.data <= hoje && r.status !== 'Marco zero');
  const saldoHoje = conta.filter(r => r.forma !== 'Dinheiro').reduce((s,r) => s + sinal(r.tipo)*r.valor, 0);
  const dinheiro = conta.filter(r => r.forma === 'Dinheiro').reduce((s,r) => s + sinal(r.tipo)*r.valor, 0);
  const investido = validos.filter(r => r.tipo === 'Investimento').reduce((s,r)=>s+r.valor,0) - validos.filter(r => r.tipo === 'Retirada').reduce((s,r)=>s+r.valor,0);
  const futuros = ord.filter(r => r.data >= hoje);
  let menor = null;
  for (const r of futuros) if (!menor || r.saldo < menor.saldo) menor = r;
  const proxSal = ord.find(r => r.desc === 'Salário' && r.data > hoje);
  return { ord, saldoHoje, dinheiro, investido, patrimonio: saldoHoje + investido + dinheiro, menor, proxSal };
}
function resumoMes(mes){
  const rs = S.rows.filter(r => r.data && ym(r.data) === mes);
  const ent = rs.filter(r => r.tipo === 'Entrada' || r.tipo === 'Retirada').reduce((s,r)=>s+r.valor,0);
  const sai = rs.filter(r => normTipo(r.tipo) === 'Saída').reduce((s,r)=>s+r.valor,0);
  const inv = rs.filter(r => r.tipo === 'Investimento').reduce((s,r)=>s+r.valor,0);
  const cartao = rs.filter(r => normTipo(r.tipo) === 'Saída' && r.forma === 'Cartão').reduce((s,r)=>s+r.valor,0);
  const porCat = {};
  rs.filter(r => normTipo(r.tipo) === 'Saída').forEach(r => porCat[r.cat] = (porCat[r.cat]||0) + r.valor);
  const pendente = rs.filter(r => normTipo(r.tipo) === 'Saída' && r.status !== 'Pago').reduce((s,r)=>s+r.valor,0);
  const saldos = rs.filter(r => r.saldo != null);
  const menor = saldos.length ? saldos.reduce((a,b) => b.saldo < a.saldo ? b : a) : null;
  return { rs, ent, sai, inv, cartao, porCat, pendente, menor };
}

function barras(obj, clicavel){
  const arr = Object.entries(obj).sort((a,b)=>b[1]-a[1]); const max = arr[0]?.[1] || 1;
  return arr.map(([k,v]) => `<div class="b" style="--c:${corCat(k)};${clicavel?'cursor:pointer':''}" ${clicavel?`onclick="S.filtroCat='${esc(k)}';S.busca='';irPara('lista')"`:''}><div class="t"><span><i></i>${esc(k)}</span><b>${fmtBRL(v)}</b></div><div class="track"><div class="fill" style="width:${Math.max(2,v/max*100)}%"></div></div></div>`).join('');
}
function barrasLimite(porCat, lim, clicavel){
  lim = lim || {};
  const cats = [...new Set([...Object.keys(porCat), ...Object.keys(lim)])];
  const max = Math.max(1, ...cats.map(c => porCat[c] || 0));
  return cats.sort((a,b) => (porCat[b]||0) - (porCat[a]||0)).map(c => {
    const g = porCat[c] || 0, L = lim[c];
    const pct = L ? g / L * 100 : g / max * 100;
    const cls = L ? (g > L ? 'bad' : g >= 0.9 * L ? 'warn' : '') : '';
    return `<div class="b" style="--c:${corCat(c)};${clicavel ? 'cursor:pointer' : ''}" ${clicavel ? `onclick="S.filtroCat='${esc(c)}';S.busca='';irPara('lista')"` : ''}>
      <div class="t"><span><i></i>${esc(c)}</span><b class="${cls==='bad'?'neg':''}">${fmtBRL(g)}${L ? ` <span class="muted small" style="font-weight:500">de ${fmtBRL(L)}</span>` : ''}</b></div>
      <div class="track"><div class="fill ${cls}" style="width:${Math.min(100, Math.max(2, pct))}%"></div></div></div>`;
  }).join('');
}

}

function abrirForm(rowNum, prefill){
  if (rowNum < 0) return toast('Este lançamento está guardado no aparelho e vai para a planilha quando houver internet.', 4000);
  const ed = rowNum ? S.rows.find(r => r.row === rowNum) : null;
  const l = ed ? { ...ed, tipo: normTipo(ed.tipo) } : { data: today(), desc:'', cat:'', tipo:'Saída', forma:'Débito', status:'Pago', valor:'', obs:'', rec:'Única', ...(prefill || {}) };

const recAtual = () => document.querySelector('#segRec button.on')?.dataset.v || '';
function setRec(v){
  document.querySelectorAll('#segRec button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  const box = $('#parcBox'); if (box){ box.style.display = v === 'Parcelada' ? '' : 'none'; if (v === 'Parcelada') S._parcInfo?.(); }
}
function lerForm(){
  return {
    rec: recAtual(),
    tipo: document.querySelector('#segTipo button.on').dataset.v,
    valor: parseValor($('#fValor').value), desc: $('#fDesc').value.trim(), data: $('#fData').value,
    cat: $('#fCat').value, forma: $('#fForma').value, status: $('#fStatus').value, obs: $('#fObs').value.trim()
  };
}
function gerarParcelas(l, n, modo){
  if (!(n >= 2 && n <= 60) || !(l.valor > 0) || !l.data) return null;
  const total = Math.round(l.valor * 100) * (modo === 'total' ? 1 : n);
  const base = Math.floor(total / n), resto = total - base * n;
  return Array.from({ length: n }, (_, i) => ({
    ...l, desc: `${l.desc} ${i+1}/${n}`, data: addMesesData(l.data, i),
    valor: (base + (i === n - 1 ? resto : 0)) / 100,
    status: i === 0 ? l.status : 'Programado'
  }));
}
function duplicar(rowNum){
  const r = S.rows.find(x => x.row === rowNum); if (!r) return;
  $('#sheet')?.remove();
  abrirForm(0, { desc: baseDesc(r.desc), cat: r.cat, tipo: normTipo(r.tipo), forma: r.forma, valor: r.valor, obs: r.obs, status: 'Pago', rec: r.rec === 'Recorrente' ? 'Recorrente' : 'Única' });
}
async function salvar(rowNum){
  const l = lerForm();
  if (!(l.valor > 0)) return toast('Informe um valor válido');
  if (!l.desc) return toast('Informe a descrição');
  if (!l.data) return toast('Informe a data');
  if (!l.cat) return toast('Escolha a categoria');
  let lista = [l];
  if (!rowNum && l.rec === 'Parcelada'){
    lista = gerarParcelas(l, parseInt($('#fNParc').value, 10), $('#fParcModo').value);
    if (!lista) return toast('Informe de 2 a 60 parcelas');
  }
  const btn = $('#fSalvar'); btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    let guardado = false;
    if (rowNum){
      if (S.mode === 'graph'){ await gravarLinha(rowNum, l); await carregarGraph(); }
      else Object.assign(S.rows.find(r => r.row === rowNum), l);
    } else guardado = await inserirNovos(lista);
    $('#sheet')?.remove();
    toast(guardado ? 'Sem internet: guardado no aparelho, será enviado à planilha depois' : rowNum ? 'Alterações salvas ✓' : lista.length > 1 ? `${lista.length} parcelas lançadas ✓` : 'Lançado ✓', guardado ? 4500 : 2600);
    render();
  } catch(e){ btn.disabled = false; btn.textContent = 'Tentar de novo'; toast('Erro: ' + e.message, 5000); }
}
async function excluir(rowNum){
  const r = S.rows.find(x => x.row === rowNum);
  if (!confirm(`Excluir "${r.desc}" de ${fmtDataLonga(r.data)} (${fmtBRL(r.valor)})?\nA linha ${rowNum} será esvaziada na planilha.`)) return;
  try {
    if (S.mode === 'graph'){ await limparLinha(rowNum); await carregarGraph(); }
    else S.rows = S.rows.filter(x => x.row !== rowNum);
    $('#sheet')?.remove(); toast('Excluído'); render();
  } catch(e){ toast('Erro: ' + e.message, 5000); }
}
async function marcarPago(rowNum){
  const r = S.rows.find(x => x.row === rowNum); if (!r) return;
  try {
    if (S.mode === 'graph'){
      const base = `${await wb()}/worksheets('${encodeURIComponent(S.sheetName)}')`;
      await graph('PATCH', `${base}/range(address='F${rowNum}')`, { values: [['Pago']] });
    }
    r.status = 'Pago'; toast(`"${r.desc}" marcado como pago ✓`); render();
  } catch(e){ toast('Erro: ' + e.message, 5000); }
}

function abrirSheet(html){

const fechar = `<button class="iconbtn plain" aria-label="Fechar" onclick="$('#sheet').remove()">${ic('x',20)}</button>`;

/* Programar o próximo mês a partir dos lançamentos de um mês */
const baseDesc = d => d.replace(/\s*\d+\/\d+$/, '').trim();
function abrirProgramar(orig){
  const dest = addMes(orig, 1);
  const noDestino = new Set(S.rows.filter(r => r.data && ym(r.data) === dest).map(r => r.desc.trim().toLowerCase()));
  const meses = {}; S.rows.forEach(r => { if (!r.data) return; const k = baseDesc(r.desc).toLowerCase(); (meses[k] = meses[k] || new Set()).add(ym(r.data)); });
  const itens = S.rows.filter(r => r.data && ym(r.data) === orig && !r.pendente && r.status !== 'Marco zero')
    .sort((a,b) => a.data === b.data ? a.row - b.row : (a.data < b.data ? -1 : 1))
    .map(r => {
      const p = r.desc.match(/^(.*?)\s*(\d+)\/(\d+)$/);
      let desc = r.desc, nota = '';
      if (p){ const a = +p[2], n = +p[3]; if (a >= n) nota = 'última parcela'; else desc = `${p[1]} ${a+1}/${n}`; }
      if (!nota && noDestino.has(desc.trim().toLowerCase())) nota = `já existe em ${MESES[+dest.slice(5)-1]}`;
      // marcação explícita (coluna Recorrência) manda; sem marcação, deduz pelo histórico
      const recorrente = !!p || r.rec === 'Recorrente' || (!r.rec && (meses[baseDesc(r.desc).toLowerCase()]?.size || 0) >= 2);
      return { r, desc, parc: !!p, data: addMesesData(r.data, 1), nota, marcado: !nota && recorrente };
    });
  S._prog = itens;
  abrirSheet(`<h3>Programar ${nomeMes(dest)}${fechar}</h3>
    <p class="small muted" style="margin-top:0">Copia lançamentos de ${nomeMes(orig)} para o mês seguinte como <b>Programado</b> (ou Previsão). Já vêm marcados os que se repetem em outros meses e as parcelas, que avançam para a próxima (ex.: 2/12 → 3/12). Ajuste valores se precisar.</p>
    ${itens.length ? `<div class="row" style="margin-bottom:6px"><button class="btn sec sm" onclick="document.querySelectorAll('.progchk:not(:disabled)').forEach(c=>c.checked=true);contarProg()">Marcar todos</button><button class="btn sec sm" onclick="document.querySelectorAll('.progchk').forEach(c=>c.checked=false);contarProg()">Desmarcar todos</button></div>
    <ul class="list card" style="padding:4px 12px">${itens.map((x, i) => `<li class="item ${x.nota ? 'off' : ''}" style="cursor:default">
      <input type="checkbox" class="progchk" data-i="${i}" ${x.marcado ? 'checked' : ''} ${x.nota ? 'disabled' : ''} onchange="contarProg()">
      <div class="main"><div class="d">${esc(x.desc)}</div><div class="s">${fmtData(x.data)} · ${esc(x.r.cat)} · ${esc(x.r.forma)}${x.r.rec === 'Única' && !x.parc ? ' · única vez' : ''}${x.nota ? ` · <b>${x.nota}</b>` : ''}</div></div>
      <input class="i mini" id="progv${i}" inputmode="decimal" value="${String(x.r.valor).replace('.', ',')}" ${x.nota ? 'disabled' : ''}></li>`).join('')}</ul>
    <button class="btn" id="progBtn" style="width:100%" onclick="salvarProgramacao()"></button>` : '<div class="muted">Nenhum lançamento neste mês para copiar.</div>'}`);
  contarProg();
}
function contarProg(){ const n = document.querySelectorAll('.progchk:checked').length, b = $('#progBtn'); if (b){ b.textContent = n ? `Programar ${n} lançamento(s)` : 'Nada marcado'; b.disabled = !n; } }
async function salvarProgramacao(){
  const lista = [];
  for (const c of document.querySelectorAll('.progchk:checked')){
    const x = S._prog[+c.dataset.i], v = parseValor($('#progv' + c.dataset.i).value);
    if (!(v > 0)) return toast(`Valor inválido em "${x.desc}"`);
    lista.push({ data: x.data, desc: x.desc, cat: x.r.cat, tipo: normTipo(x.r.tipo), forma: x.r.forma, status: x.r.status === 'Previsão' ? 'Previsão' : 'Programado', valor: v, obs: x.r.obs || '', rec: x.parc ? 'Parcelada' : 'Recorrente' });
  }
  const b = $('#progBtn'); b.disabled = true; b.textContent = 'Gravando…';
  try {
    const guardado = await inserirNovos(lista);
    $('#sheet')?.remove();
    S.mes = ym(lista[0].data); render();
    toast(guardado ? 'Sem internet: guardados no aparelho, serão enviados depois' : `${lista.length} lançamento(s) programado(s) ✓`, 3500);
  } catch(e){ b.disabled = false; b.textContent = 'Tentar de novo'; toast('Erro: ' + e.message, 5000); }
}

/* Fatura do cartão no mês */
function abrirFatura(mes){
  const rs = S.rows.filter(r => r.data && ym(r.data) === mes && normTipo(r.tipo) === 'Saída' && r.forma === 'Cartão')
    .sort((a,b) => a.data === b.data ? a.row - b.row : (a.data < b.data ? -1 : 1));
  const tot = rs.reduce((s,r) => s + r.valor, 0), pago = rs.filter(r => r.status === 'Pago').reduce((s,r) => s + r.valor, 0);
  const porCat = {}; rs.forEach(r => porCat[r.cat] = (porCat[r.cat] || 0) + r.valor);
  const ant = resumoMes(addMes(mes, -1)).cartao;
  abrirSheet(`<h3>Cartão · ${nomeMes(mes)}${fechar}</h3>
    <div class="kpis">
      <div class="kpi big"><div class="l">Total no mês (${rs.length} lançamentos)</div><div class="v">${fmtBRL(tot)}</div>
        <div class="small muted">${ant ? `Mês anterior: ${fmtBRL(ant)} (${tot >= ant ? '+' : '−'}${fmtBRL(Math.abs(tot - ant))})` : ''}</div></div>
      <div class="kpi"><div class="l">Pago</div><div class="v">${fmtBRL(pago)}</div></div>
      <div class="kpi"><div class="l">Programado / previsto</div><div class="v">${fmtBRL(tot - pago)}</div></div>
    </div>
    ${rs.length ? `<div class="card"><h2>Por categoria</h2><div class="bars">${barras(porCat)}</div></div>
    <div class="card" style="padding:2px 14px"><ul class="list">${rs.map(r => itemHTML(r, { noclick: true })).join('')}</ul></div>` : '<div class="empty">Nenhuma compra no cartão neste mês.</div>'}
    <p class="small muted">Considera as saídas com forma "Cartão" pela data lançada, igual ao quadro CARTÃO do Dashboard.</p>`);
}

    `<p class="muted" style="margin:0">Primeira vez? Cole o <b>ID do aplicativo (cliente)</b> criado no portal da Microsoft (o passo a passo está no LEIA-ME).</p>
      <input class="i" id="cid" placeholder="ex.: 1a2b3c4d-…">
      <button class="btn block" onclick="const v=$('#cid').value.trim(); if(!/^[0-9a-f-]{36}$/i.test(v)) return toast('ID inválido'); lsSet('cf_clientId',v); location.reload()">Salvar e continuar</button>`}
    <button class="btn sec block" onclick="lsSet('cf_demo','1');location.reload()">Ver demonstração</button>
  </div></div>`;
}
async function entrar(){ await msalApp.loginRedirect({ scopes: SCOPES }); }

/* ---------------- início ---------------- */
(async function main(){
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return $('#sheet')?.remove();
    const digitando = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '');
    if (!digitando && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key === 'n' || e.key === 'N') && !$('#sheet') && S.mode){ e.preventDefault(); abrirForm(); }
  });
  if (lsGet('cf_demo')){
    S.mode = 'demo'; S.rows = dadosDemo(); S.limites = { 'Lazer': 300, 'Alimentação': 1200 }; S.limitesOk = true; render(); return;
  }
  window.addEventListener('online', () => { if (S.mode === 'graph') recarregar(); });
  if (!window.msal) return telaInicial('Não foi possível carregar a biblioteca de login da Microsoft. Verifique a internet.');
  if (!clientId()) return telaInicial();
  $('#root').innerHTML = '<div class="center"><div class="spinner"></div><div class="muted">Conectando…</div></div>';
  try {
    const logado = await initMsal();
    if (!logado) return telaInicial();
    S.mode = 'graph';
    $('#root').innerHTML = '<div class="center"><div class="spinner"></div><div class="muted">Lendo a planilha…</div></div>';
    try { await carregarGraph(); }
    catch(e){
      // sem internet: usa a última cópia guardada no aparelho
      let cache = null; try { cache = JSON.parse(lsGet('cf_cache')); } catch(_){}
      if (!(isOffline(e) && cache)) throw e;
      Object.assign(S, { rows: cache.rows, emptyRows: cache.emptyRows, sheetName: cache.sheetName, limites: cache.limites || {}, limitesRow: cache.limitesRow || {},
        limitesOk: Object.keys(cache.limitesRow || {}).length > 0, offlineDesde: cache.t });
      aplicarFila();
    }
    render();
    enviarFila();
  } catch(e){
    console.error(e);
    telaInicial('Erro: ' + (e.errorMessage ? `${e.errorCode} — ${e.errorMessage}` : e.message));
  }
})();
</script>
