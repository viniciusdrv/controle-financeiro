<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --text:#14201d; --muted:#5f6f6a; --line:#e2e8e6;
  --brand:#0f766e; --brand-soft:#d7efec; --pos:#15803d; --neg:#b91c1c; --warn:#b45309;
  --pos-soft:#dcfce7; --neg-soft:#fee2e2; --warn-soft:#fef3c7; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1513; --card:#17211e; --text:#e6eeeb; --muted:#93a39e; --line:#26332f;
    --brand:#2dd4bf; --brand-soft:#123631; --pos:#4ade80; --neg:#f87171; --warn:#fbbf24;
    --pos-soft:#11301d; --neg-soft:#3a1616; --warn-soft:#3a2c0d; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:820px;margin:0 auto}
header.top h1{font-size:18px;margin:0;flex:1}
.iconbtn{border:0;background:transparent;font-size:20px;padding:6px 8px;border-radius:10px;cursor:pointer}
.iconbtn:hover{background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.big{grid-column:1/-1} .kpi.big .v{font-size:28px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)} .kpi.big{grid-column:span 2}}
.alert{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.alert.ok{background:var(--pos-soft);color:var(--pos)} .alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.bad{background:var(--neg-soft);color:var(--neg)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .small{font-size:12px}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .d{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.item .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--muted);margin-left:4px}
.badge.Programado{background:var(--brand-soft);color:var(--brand)} .badge.Previsão{background:var(--warn-soft);color:var(--warn)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.sec):not(.danger){color:#062a26}}
.btn.sec{background:var(--line);color:var(--text)} .btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px} .row>*{flex:1}
label.f{display:block;margin-bottom:10px} label.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input.i,select.i,textarea.i{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);font-size:16px}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--brand);border-color:transparent}
.valor{font-size:28px!important;font-weight:700;text-align:center}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:200px;border:0;background:transparent;padding:8px 4px 10px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs button.add .ic{background:var(--brand);color:#fff;border-radius:14px;width:44px;height:30px;display:flex;align-items:center;justify-content:center;font-size:22px}
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.monthnav strong{flex:1;text-align:center;font-size:16px}
.bars .b{margin-bottom:9px} .bars .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bars .track{height:8px;background:var(--line);border-radius:99px;overflow:hidden} .bars .fill{height:100%;background:var(--brand);border-radius:99px}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right} table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.grouph{font-size:12px;font-weight:700;color:var(--muted);margin:14px 2px 4px;text-transform:uppercase;display:flex;justify-content:space-between}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;max-width:90vw;text-align:center}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chartbox{position:relative;height:220px}
.demo-banner{background:var(--warn-soft);color:var(--warn);font-size:12px;text-align:center;padding:5px;font-weight:600}
.bars .fill.warn{background:var(--warn)} .bars .fill.bad{background:var(--neg)}
.chk{display:flex;align-items:center;gap:8px;margin:2px 0 10px;cursor:pointer;font-weight:600}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);flex:0 0 auto}
input.mini{width:108px;padding:6px 8px;font-size:15px;text-align:right;flex:0 0 auto}
.item.off{opacity:.45}
.h2row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px} .h2row h2{margin:0}
</style>

<body>
<div id="root"></div>
<script>
/* ============================================================
   CONFIGURAÇÃO — cole aqui o "ID do aplicativo (cliente)" do
   registro no portal da Microsoft (veja LEIA-ME.md).
   Se ficar vazio, o app pede o ID na primeira vez.
   ============================================================ */
const CLIENT_ID = '5f1e7927-b93f-4d16-9d87-628370dd7e12';
const FILE_PATH = '/PESSOAL/Controle Financeiro.xlsx';
const TABLE_NAME = 'Tabela1';

const TIPOS = ['Saída','Entrada','Investimento','Retirada'];
const FORMAS = ['Débito','Cartão','Conta','Dinheiro'];
const STATUS = ['Pago','Programado','Previsão'];
const CATEGORIAS = ['Alimentação','Animais','Assinaturas','Cartão','Combustível','Cuidados Pessoais','Diversos','Educação','Investimento','Lazer','Moradia','Renda','Repasses','Saúde','Telefonia'];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_LONGO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pad = n => String(n).padStart(2,'0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoLocal(new Date());
const fmtData = iso => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}` : '';
const fmtDataLonga = iso => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}` : '';
const ym = iso => iso.slice(0,7);
const serialToIso = s => { const d = new Date(Date.UTC(1899,11,30) + Math.round(Number(s))*864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const isoToSerial = iso => { const [y,m,d] = iso.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d) - Date.UTC(1899,11,30))/864e5); };
const normTipo = t => t === 'Saida' ? 'Saída' : t;
const sinal = t => (t === 'Entrada' || t === 'Retirada') ? 1 : -1; // mesma regra da planilha
function parseValor(v){
  v = String(v||'').trim().replace(/[R$\s]/g,'');
  if (v.includes(',')) v = v.replace(/\./g,'').replace(',','.');
  const n = parseFloat(v); return isNaN(n) ? NaN : Math.round(n*100)/100;
}
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }

/* ---------------- estado ---------------- */
const S = {
  mode: null,           // 'graph' | 'demo'
  rows: [],             // lançamentos preenchidos
  emptyRows: [],        // linhas vazias dentro da tabela (onde novos lançamentos entram)
  sheetName: 'Timeline',
  tab: lsGet('cf_tab') || 'home',
  mes: ym(today()),
  busca: '', filtroCat: '',
  loading: false,
  limites: {}, limitesRow: {}, limitesOk: false,   // aba "Limites" da planilha
  offlineDesde: null,                             // quando está mostrando dados guardados no aparelho
};
let charts = {};

/* ---------------- Microsoft Graph ---------------- */
let msalApp = null, itemId = null;
const SCOPES = ['Files.ReadWrite'];
function clientId(){ return CLIENT_ID || lsGet('cf_clientId') || ''; }

async function initMsal(){
  msalApp = new msal.PublicClientApplication({
    auth:{ clientId: clientId(), authority:'https://login.microsoftonline.com/consumers', redirectUri: location.origin + location.pathname },
    cache:{ cacheLocation:'localStorage' }
  });
  await msalApp.initialize();
  const res = await msalApp.handleRedirectPromise();
  if (res && res.account) msalApp.setActiveAccount(res.account);
  else { const a = msalApp.getAllAccounts(); if (a.length) msalApp.setActiveAccount(a[0]); }
  return !!msalApp.getActiveAccount();
}
function erroOffline(){ return Object.assign(new Error('Sem conexão com a internet'), { offline:true }); }
const isOffline = e => !!(e && (e.offline || !navigator.onLine));
async function token(){
  const account = msalApp.getActiveAccount();
  try { return (await msalApp.acquireTokenSilent({ scopes:SCOPES, account })).accessToken; }
  catch(e){
    if (!navigator.onLine || /network|endpoints_resolution/i.test(e.errorCode || '')) throw erroOffline();
    await msalApp.acquireTokenRedirect({ scopes:SCOPES, account }); throw new Error('Redirecionando para login…');
  }
}
async function graph(method, path, body, tentativa=0){
  const tk = await token();
  let r;
  try {
    r = await fetch('https://graph.microsoft.com/v1.0' + path, {
      method, headers:{ Authorization:'Bearer ' + tk, 'Content-Type':'application/json' },
      body: body ? JSON.stringify(body) : (method === 'POST' ? '{}' : undefined)
    });
  } catch(e){ throw erroOffline(); }
  if ((r.status === 429 || r.status >= 500) && tentativa < 2){ await new Promise(ok=>setTimeout(ok, 1200*(tentativa+1))); return graph(method, path, body, tentativa+1); }
  if (!r.ok){ let m = r.status + ''; try{ const j = await r.json(); m = j.error?.message || m; }catch(e){} throw new Error(m); }
  return r.status === 204 ? null : r.json();
}
async function getItemId(){
  if (itemId) return itemId;
  const p = FILE_PATH.split('/').map(encodeURIComponent).join('/');
  itemId = (await graph('GET', `/me/drive/root:${p}?$select=id`)).id;
  return itemId;
}
const wb = async () => `/me/drive/items/${await getItemId()}/workbook`;

/* Lê a Tabela1 inteira e separa linhas preenchidas e vazias */
async function carregarGraph(){
  const res = await graph('GET', `${await wb()}/tables('${TABLE_NAME}')/range?$select=address,values`);
  const [sheet, ref] = res.address.split('!');
  S.sheetName = sheet.replace(/^'|'$/g,'');
  const firstRow = parseInt(ref.match(/\d+/)[0], 10);
  const vals = res.values;
  const head = vals[0].map(h => String(h).trim());
  const ix = n => head.indexOf(n);
  const c = { data:ix('Data'), desc:ix('Descrição'), cat:ix('Categoria'), tipo:ix('Tipo'), forma:ix('Forma'), status:ix('Status'), valor:ix('Valor'), obs:ix('Obs') };
  if (c.data !== 0 || c.valor !== 6 || c.obs !== 8) throw new Error('A estrutura da Tabela1 mudou (colunas esperadas: Data…Valor em A–G, Obs em I).');
  const rows = [], empty = [];
  for (let i = 1; i < vals.length; i++){
    const v = vals[i], rowNum = firstRow + i;
    const vazio = v[c.data] === '' && v[c.desc] === '' && v[c.valor] === '';
    if (vazio){ empty.push(rowNum); continue; }
    rows.push({
      row: rowNum,
      data: typeof v[c.data] === 'number' ? serialToIso(v[c.data]) : '',
      desc: String(v[c.desc]), cat: String(v[c.cat]), tipo: String(v[c.tipo]), forma: String(v[c.forma]),
      status: String(v[c.status]), valor: Number(v[c.valor]) || 0, obs: String(v[c.obs] ?? '')
    });
  }
  S.rows = rows; S.emptyRows = empty;
  await carregarLimites();
  S.offlineDesde = null;
  lsSet('cf_cache', JSON.stringify({ t: Date.now(), rows, emptyRows: empty, sheetName: S.sheetName, limites: S.limites, limitesRow: S.limitesRow }));
  aplicarFila();
}
/* Grava vários lançamentos novos nas primeiras linhas vazias (em blocos contínuos) */
async function gravarVarias(lista){
  await carregarGraph(); // estado mais recente, para não sobrescrever nada
  if (S.emptyRows.length < lista.length) throw new Error(`A Tabela1 só tem ${S.emptyRows.length} linha(s) livre(s). Abra a planilha e aumente a tabela (arraste o canto inferior).`);
  const alvo = S.emptyRows.slice(0, lista.length);
  const base = `${await wb()}/worksheets('${encodeURIComponent(S.sheetName)}')`;
  for (let i = 0; i < alvo.length; ){
    let j = i; while (j + 1 < alvo.length && alvo[j+1] === alvo[j] + 1) j++;
    const parte = lista.slice(i, j + 1), ini = alvo[i], fim = alvo[j];
    await graph('PATCH', `${base}/range(address='A${ini}:G${fim}')`, { values: parte.map(l => linhaParaValores(l)[0]) });
    if (parte.some(l => l.obs)) await graph('PATCH', `${base}/range(address='I${ini}:I${fim}')`, { values: parte.map(l => [l.obs || '']) });
    i = j + 1;
  }
  await carregarGraph();
}

/* ---------------- limites por categoria (aba "Limites") ---------------- */
const CATS_LIMITE = CATEGORIAS.filter(c => !['Renda','Investimento','Cartão'].includes(c));
async function carregarLimites(){
  try {
    const res = await graph('GET', `${await wb()}/worksheets('Limites')/range(address='A1:B60')?$select=values`);
    const lim = {}, pos = {};
    res.values.forEach((v, i) => {
      const c = String(v[0]).trim(); if (i === 0 || !c) return;
      pos[c] = i + 1; const n = Number(v[1]); if (v[1] !== '' && n > 0) lim[c] = n;
    });
    S.limites = lim; S.limitesRow = pos; S.limitesOk = true;
  } catch(e){ if (isOffline(e)) throw e; S.limites = {}; S.limitesRow = {}; S.limitesOk = false; }
}
async function criarAbaLimites(){
  const w = await wb(), n = CATS_LIMITE.length, fim = n + 1, T = 'Timeline!';
  await graph('POST', `${w}/worksheets/add`, { name: 'Limites' });
  const mes = `${T}$A$2:$A$581,">="&(EOMONTH(TODAY(),-1)+1),${T}$A$2:$A$581,"<="&EOMONTH(TODAY(),0)`;
  const formulas = [['Categoria','Limite mensal','Previsto no mês atual','Disponível'],
    ...CATS_LIMITE.map((c, i) => { const r = i + 2; return [c, '', `=SUMIFS(${T}$G$2:$G$581,${T}$D$2:$D$581,"Saída",${T}$J$2:$J$581,$A${r},${mes})`, `=IF(B${r}="","",B${r}-C${r})`]; })];
  const base = `${w}/worksheets('Limites')`;
  await graph('PATCH', `${base}/range(address='A1:D${fim}')`, { formulas });
  await graph('PATCH', `${base}/range(address='B2:D${fim}')`, { numberFormat: Array.from({ length: n }, () => Array(3).fill('"R$" #,##0.00')) });
  await graph('PATCH', `${base}/range(address='A1:D1')/format/font`, { bold: true });
  try { await graph('POST', `${base}/range(address='A1:D${fim}')/format/autofitColumns`); } catch(e){}
}
async function gravarLimites(valores){ // valores: { categoria: número ou '' }
  const linhas = Object.values(S.limitesRow); if (!linhas.length) return;
  const ini = Math.min(...linhas), fim = Math.max(...linhas);
  const porLinha = Object.fromEntries(Object.entries(S.limitesRow).map(([c, r]) => [r, c]));
  const values = []; for (let r = ini; r <= fim; r++){ const c = porLinha[r]; values.push([c && valores[c] !== undefined ? valores[c] : (c && S.limites[c] ? S.limites[c] : '')]); }
  await graph('PATCH', `${await wb()}/worksheets('Limites')/range(address='B${ini}:B${fim}')`, { values });
  await carregarLimites();
}

/* ---------------- fila offline ---------------- */
const fila = () => { try { return JSON.parse(lsGet('cf_fila') || '[]'); } catch(e){ return []; } };
const setFila = f => lsSet('cf_fila', f.length ? JSON.stringify(f) : null);
function aplicarFila(){ S.rows = S.rows.filter(r => !r.pendente).concat(fila().map((l, i) => ({ ...l, row: -(i + 1), pendente: true }))); }
async function enviarFila(){
  const f = fila(); if (!f.length || S.mode !== 'graph') return;
  try {
    await gravarVarias(f); setFila([]); aplicarFila();
    toast(`${f.length} lançamento(s) guardado(s) enviado(s) para a planilha ✓`); render();
  } catch(e){ if (!isOffline(e)) toast('Erro ao enviar lançamentos guardados: ' + e.message, 5000); }
}
/* Insere lançamentos novos; sem internet, guarda no aparelho. Retorna true se ficou guardado. */
async function inserirNovos(lista){
  if (S.mode !== 'graph'){ let m = Math.max(1, ...S.rows.map(r => r.row)); lista.forEach(l => S.rows.push({ row: ++m, ...l })); return false; }
  try { await gravarVarias(lista); return false; }
  catch(e){ if (!isOffline(e)) throw e; setFila(fila().concat(lista)); aplicarFila(); return true; }
}
function addMesesData(iso, k){
  const [y, m, d] = iso.split('-').map(Number);
  const ult = new Date(y, m - 1 + k + 1, 0).getDate();
  return isoLocal(new Date(y, m - 1 + k, Math.min(d, ult)));
}
function linhaParaValores(l){ return [[ isoToSerial(l.data), l.desc, l.cat, l.tipo, l.forma, l.status, l.valor ]]; }

/* ---------------- cálculos (mesmas regras do Dashboard) ---------------- */
function calcular(){
  const hoje = today();
  const validos = S.rows.filter(r => r.data);
  // saldo projetado: ordem por data e, no mesmo dia, pela ordem da linha
  const ord = [...validos].sort((a,b) => a.data === b.data ? a.row - b.row : (a.data < b.data ? -1 : 1));
  let acc = 0;
  for (const r of ord){ if (r.status !== 'Marco zero') acc += sinal(r.tipo) * r.valor; r.saldo = Math.round(acc*100)/100; }
  const conta = validos.filter(r => r.data <= hoje && r.status !== 'Marco zero');
  const saldoHoje = conta.filter(r => r.forma !== 'Dinheiro').reduce((s,r) => s + sinal(r.tipo)*r.valor, 0);
  const dinheiro = conta.filter(r => r.forma === 'Dinheiro').reduce((s,r) => s + sinal(r.tipo)*r.valor, 0);
  const investido = validos.filter(r => r.tipo === 'Investimento').reduce((s,r)=>s+r.valor,0) - validos.filter(r => r.tipo === 'Retirada').reduce((s,r)=>s+r.valor,0);
  const futuros = ord.filter(r => r.data >= hoje);
  let menor = null;
  for (const r of futuros) if (!menor || r.saldo < menor.saldo) menor = r;
  const proxSal = ord.find(r => r.desc === 'Salário' && r.data > hoje);
  return { ord, saldoHoje, dinheiro, investido, patrimonio: saldoHoje + investido + dinheiro, menor, proxSal };
}
function resumoMes(mes){
  const rs = S.rows.filter(r => r.data && ym(r.data) === mes);
  const ent = rs.filter(r => r.tipo === 'Entrada' || r.tipo === 'Retirada').reduce((s,r)=>s+r.valor,0);
  const sai = rs.filter(r => normTipo(r.tipo) === 'Saída').reduce((s,r)=>s+r.valor,0);
  const inv = rs.filter(r => r.tipo === 'Investimento').reduce((s,r)=>s+r.valor,0);
  const cartao = rs.filter(r => normTipo(r.tipo) === 'Saída' && r.forma === 'Cartão').reduce((s,r)=>s+r.valor,0);
  const porCat = {};
  rs.filter(r => normTipo(r.tipo) === 'Saída').forEach(r => porCat[r.cat] = (porCat[r.cat]||0) + r.valor);
  const pendente = rs.filter(r => normTipo(r.tipo) === 'Saída' && r.status !== 'Pago').reduce((s,r)=>s+r.valor,0);
  const saldos = rs.filter(r => r.saldo != null);
  const menor = saldos.length ? saldos.reduce((a,b) => b.saldo < a.saldo ? b : a) : null;
  return { rs, ent, sai, inv, cartao, porCat, pendente, menor };
}
function mesesComDados(){ return [...new Set(S.rows.filter(r=>r.data).map(r => ym(r.data)))].sort(); }
function nomeMes(m){ const [y,mm] = m.split('-').map(Number); return `${MESES_LONGO[mm-1]} ${y}`; }
function addMes(m, n){ const [y,mm] = m.split('-').map(Number); const d = new Date(y, mm-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }

function barras(obj, clicavel){
  const arr = Object.entries(obj).sort((a,b)=>b[1]-a[1]); const max = arr[0]?.[1] || 1;
  return arr.map(([k,v]) => `<div class="b" ${clicavel?`style="cursor:pointer" onclick="S.filtroCat='${esc(k)}';S.busca='';irPara('lista')"`:''}><div class="t"><span>${esc(k)}</span><b>${fmtBRL(v)}</b></div><div class="track"><div class="fill" style="width:${Math.max(2,v/max*100)}%"></div></div></div>`).join('');
}
function barrasLimite(porCat, lim, clicavel){
  lim = lim || {};
  const cats = [...new Set([...Object.keys(porCat), ...Object.keys(lim)])];
  const max = Math.max(1, ...cats.map(c => porCat[c] || 0));
  return cats.sort((a,b) => (porCat[b]||0) - (porCat[a]||0)).map(c => {
    const g = porCat[c] || 0, L = lim[c];
    const pct = L ? g / L * 100 : g / max * 100;
    const cls = L ? (g > L ? 'bad' : g >= 0.9 * L ? 'warn' : '') : '';
    return `<div class="b" ${clicavel ? `style="cursor:pointer" onclick="S.filtroCat='${esc(c)}';S.busca='';irPara('lista')"` : ''}>
      <div class="t"><span>${esc(c)}</span><b class="${cls==='bad'?'neg':''}">${fmtBRL(g)}${L ? ` <span class="muted small">de ${fmtBRL(L)}</span>` : ''}</b></div>
      <div class="track"><div class="fill ${cls}" style="width:${Math.min(100, Math.max(2, pct))}%"></div></div></div>`;
  }).join('');
}
function tabelaCatMes(meses){
  const cats = [...new Set(S.rows.filter(r=>normTipo(r.tipo)==='Saída').map(r=>r.cat))].sort();
  const res = Object.fromEntries(meses.map(m => [m, resumoMes(m).porCat]));
  return `<table class="t"><thead><tr><th>Categoria</th>${meses.map(m=>`<th>${MESES[+m.slice(5)-1]}</th>`).join('')}<th>Total</th></tr></thead><tbody>
  ${cats.map(c => { const vs = meses.map(m => res[m][c]||0); return `<tr><td>${esc(c)}</td>${vs.map(v=>`<td>${v?fmtBRL(v).replace('R$ ',''):'–'}</td>`).join('')}<td><b>${fmtBRL(vs.reduce((a,b)=>a+b,0)).replace('R$ ','')}</b></td></tr>`; }).join('')}
  </tbody></table>`;
}

function abrirForm(rowNum, prefill){
  if (rowNum < 0) return toast('Este lançamento está guardado no aparelho e vai para a planilha quando houver internet.', 4000);
  const ed = rowNum ? S.rows.find(r => r.row === rowNum) : null;
  const l = ed ? { ...ed, tipo: normTipo(ed.tipo) } : { data: today(), desc:'', cat:'', tipo:'Saída', forma:'Débito', status:'Pago', valor:'', obs:'', ...(prefill || {}) };
  const descs = [...new Set(S.rows.map(r => r.desc).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const opt = (arr, sel) => arr.map(v => `<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('');
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="sheet">
    <h3>${ed ? 'Editar lançamento' : 'Novo lançamento'}<button class="iconbtn" onclick="$('#sheet').remove()">✕</button></h3>
    <div class="seg" id="segTipo">${TIPOS.map(t => `<button type="button" class="${t===l.tipo?'on':''}" data-v="${t}">${t}</button>`).join('')}</div>
    <label class="f"><span>Valor (R$)</span><input class="i valor" id="fValor" inputmode="decimal" placeholder="0,00" value="${l.valor!=='' ? String(l.valor).replace('.',',') : ''}"></label>
    <label class="f"><span>Descrição</span><input class="i" id="fDesc" list="dlDesc" autocomplete="off" value="${esc(l.desc)}"><datalist id="dlDesc">${descs.map(d=>`<option value="${esc(d)}">`).join('')}</datalist></label>
    <div class="row">
      <label class="f"><span>Data</span><input class="i" type="date" id="fData" value="${l.data}"></label>
      <label class="f"><span>Status</span><select class="i" id="fStatus">${opt(STATUS.includes(l.status)?STATUS:[...STATUS,l.status], l.status)}</select></label>
    </div>
    <div class="row">
      <label class="f"><span>Categoria</span><select class="i" id="fCat"><option value="">Escolha…</option>${opt(CATEGORIAS.includes(l.cat)||!l.cat?CATEGORIAS:[...CATEGORIAS,l.cat], l.cat)}</select></label>
      <label class="f"><span>Forma</span><select class="i" id="fForma">${opt(FORMAS, l.forma)}</select></label>
    </div>
    <label class="f"><span>Observação (opcional)</span><input class="i" id="fObs" value="${esc(l.obs)}"></label>
    ${ed ? '' : `<label class="chk"><input type="checkbox" id="fParc"> Compra parcelada</label>
    <div id="parcBox" style="display:none"><div class="row">
      <label class="f"><span>Nº de parcelas</span><input class="i" id="fNParc" type="number" min="2" max="60" value="2" inputmode="numeric"></label>
      <label class="f"><span>O valor digitado é</span><select class="i" id="fParcModo"><option value="parcela">de cada parcela</option><option value="total">o total da compra</option></select></label>
    </div><div id="parcInfo" class="small muted" style="margin:-4px 0 10px"></div></div>`}
    <div class="row" style="margin-top:6px">
      ${ed ? `<button class="btn danger" style="flex:0 0 auto" onclick="excluir(${ed.row})">Excluir</button>
      <button class="btn sec" style="flex:0 0 auto" onclick="duplicar(${ed.row})">Duplicar</button>` : ''}
      <button class="btn" id="fSalvar" onclick="salvar(${ed ? ed.row : 0})">${ed ? 'Salvar alterações' : 'Lançar'}</button>
    </div>
    ${ed ? `<div class="small muted" style="margin-top:8px">Linha ${ed.row} da aba ${esc(S.sheetName)}</div>` : ''}
  </div>`;
  document.body.appendChild(bg);
  bg.querySelectorAll('#segTipo button').forEach(b => b.onclick = () => {
    bg.querySelectorAll('#segTipo button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    const t = b.dataset.v;
    if (t === 'Entrada' && !$('#fCat').value) { $('#fCat').value = 'Renda'; $('#fForma').value = 'Conta'; }
    if ((t === 'Investimento' || t === 'Retirada') && !$('#fCat').value) { $('#fCat').value = 'Investimento'; $('#fForma').value = 'Conta'; }
  });
  $('#fDesc').addEventListener('change', e => {
    const ult = [...S.rows].reverse().find(r => r.desc.toLowerCase() === e.target.value.trim().toLowerCase());
    if (!ult) return;
    if (!ed){
      $('#fCat').value = ult.cat; $('#fForma').value = ult.forma;
      bg.querySelectorAll('#segTipo button').forEach(x => x.classList.toggle('on', x.dataset.v === normTipo(ult.tipo)));
      if (!$('#fValor').value) $('#fValor').value = String(ult.valor).replace('.',',');
    }
  });
  $('#fData').addEventListener('change', e => { if (!ed) $('#fStatus').value = e.target.value > today() ? 'Programado' : 'Pago'; });
  if (!ed){
    const info = () => {
      const lst = gerarParcelas(lerForm(), parseInt($('#fNParc').value, 10), $('#fParcModo').value);
      $('#parcInfo').textContent = lst ? `${lst.length}× de ${fmtBRL(lst[0].valor)} (total ${fmtBRL(lst.reduce((s,x)=>s+x.valor,0))}), de ${fmtDataLonga(lst[0].data)} a ${fmtDataLonga(lst[lst.length-1].data)}. A descrição recebe "1/${lst.length}", "2/${lst.length}"…` : 'Informe valor, data e de 2 a 60 parcelas.';
    };
    $('#fParc').addEventListener('change', e => { $('#parcBox').style.display = e.target.checked ? '' : 'none'; info(); });
    ['#fNParc','#fParcModo','#fValor','#fData'].forEach(s => $(s).addEventListener('input', () => { if ($('#fParc').checked) info(); }));
    setTimeout(() => $('#fValor').focus(), 50);
  }
}
function lerForm(){
  return {
    tipo: document.querySelector('#segTipo button.on').dataset.v,
    valor: parseValor($('#fValor').value), desc: $('#fDesc').value.trim(), data: $('#fData').value,
    cat: $('#fCat').value, forma: $('#fForma').value, status: $('#fStatus').value, obs: $('#fObs').value.trim()
  };
}
function gerarParcelas(l, n, modo){
  if (!(n >= 2 && n <= 60) || !(l.valor > 0) || !l.data) return null;
  const total = Math.round(l.valor * 100) * (modo === 'total' ? 1 : n);
  const base = Math.floor(total / n), resto = total - base * n;
  return Array.from({ length: n }, (_, i) => ({
    ...l, desc: `${l.desc} ${i+1}/${n}`, data: addMesesData(l.data, i),
    valor: (base + (i === n - 1 ? resto : 0)) / 100,
    status: i === 0 ? l.status : 'Programado'
  }));
}
function duplicar(rowNum){
  const r = S.rows.find(x => x.row === rowNum); if (!r) return;
  $('#sheet')?.remove();
  abrirForm(0, { desc: r.desc, cat: r.cat, tipo: normTipo(r.tipo), forma: r.forma, valor: r.valor, obs: r.obs, status: 'Pago' });
}
async function salvar(rowNum){
  const l = lerForm();
  if (!(l.valor > 0)) return toast('Informe um valor válido');
  if (!l.desc) return toast('Informe a descrição');
  if (!l.data) return toast('Informe a data');
  if (!l.cat) return toast('Escolha a categoria');
  let lista = [l];
  if (!rowNum && $('#fParc')?.checked){
    lista = gerarParcelas(l, parseInt($('#fNParc').value, 10), $('#fParcModo').value);
    if (!lista) return toast('Informe de 2 a 60 parcelas');
  }
  const btn = $('#fSalvar'); btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    let guardado = false;
    if (rowNum){
      if (S.mode === 'graph'){ await gravarLinha(rowNum, l); await carregarGraph(); }
      else Object.assign(S.rows.find(r => r.row === rowNum), l);
    } else guardado = await inserirNovos(lista);
    $('#sheet')?.remove();
    toast(guardado ? 'Sem internet: guardado no aparelho, será enviado à planilha depois' : rowNum ? 'Alterações salvas ✓' : lista.length > 1 ? `${lista.length} parcelas lançadas ✓` : 'Lançado ✓', guardado ? 4500 : 2600);
    render();
  } catch(e){ btn.disabled = false; btn.textContent = 'Tentar de novo'; toast('Erro: ' + e.message, 5000); }
}
async function excluir(rowNum){
  const r = S.rows.find(x => x.row === rowNum);
  if (!confirm(`Excluir "${r.desc}" de ${fmtDataLonga(r.data)} (${fmtBRL(r.valor)})?\nA linha ${rowNum} será esvaziada na planilha.`)) return;
  try {
    if (S.mode === 'graph'){ await limparLinha(rowNum); await carregarGraph(); }
    else S.rows = S.rows.filter(x => x.row !== rowNum);
    $('#sheet')?.remove(); toast('Excluído'); render();
  } catch(e){ toast('Erro: ' + e.message, 5000); }
}
async function marcarPago(rowNum){
  const r = S.rows.find(x => x.row === rowNum); if (!r) return;
  try {
    if (S.mode === 'graph'){
      const base = `${await wb()}/worksheets('${encodeURIComponent(S.sheetName)}')`;
      await graph('PATCH', `${base}/range(address='F${rowNum}')`, { values: [['Pago']] });
    }
    r.status = 'Pago'; toast(`"${r.desc}" marcado como pago ✓`); render();
  } catch(e){ toast('Erro: ' + e.message, 5000); }
}

/* ---------------- janelas auxiliares ---------------- */
function abrirSheet(html){
  $('#sheet')?.remove();
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="sheet">${html}</div>`; document.body.appendChild(bg); return bg;
}
const fechar = `<button class="iconbtn" onclick="$('#sheet').remove()">✕</button>`;

/* Programar o próximo mês a partir dos lançamentos de um mês */
const baseDesc = d => d.replace(/\s*\d+\/\d+$/, '').trim();
function abrirProgramar(orig){
  const dest = addMes(orig, 1);
  const noDestino = new Set(S.rows.filter(r => r.data && ym(r.data) === dest).map(r => r.desc.trim().toLowerCase()));
  const meses = {}; S.rows.forEach(r => { if (!r.data) return; const k = baseDesc(r.desc).toLowerCase(); (meses[k] = meses[k] || new Set()).add(ym(r.data)); });
  const itens = S.rows.filter(r => r.data && ym(r.data) === orig && !r.pendente && r.status !== 'Marco zero')
    .sort((a,b) => a.data === b.data ? a.row - b.row : (a.data < b.data ? -1 : 1))
    .map(r => {
      const p = r.desc.match(/^(.*?)\s*(\d+)\/(\d+)$/);
      let desc = r.desc, nota = '';
      if (p){ const a = +p[2], n = +p[3]; if (a >= n) nota = 'última parcela'; else desc = `${p[1]} ${a+1}/${n}`; }
      if (!nota && noDestino.has(desc.trim().toLowerCase())) nota = `já existe em ${MESES[+dest.slice(5)-1]}`;
      const recorrente = (meses[baseDesc(r.desc).toLowerCase()]?.size || 0) >= 2 || !!p;
      return { r, desc, data: addMesesData(r.data, 1), nota, marcado: !nota && recorrente };
    });
  S._prog = itens;
  abrirSheet(`<h3>Programar ${nomeMes(dest)}${fechar}</h3>
    <p class="small muted" style="margin-top:0">Copia lançamentos de ${nomeMes(orig)} para o mês seguinte como <b>Programado</b> (ou Previsão). Já vêm marcados os que se repetem em outros meses e as parcelas, que avançam para a próxima (ex.: 2/12 → 3/12). Ajuste valores se precisar.</p>
    ${itens.length ? `<div class="row" style="margin-bottom:6px"><button class="btn sec sm" onclick="document.querySelectorAll('.progchk:not(:disabled)').forEach(c=>c.checked=true);contarProg()">Marcar todos</button><button class="btn sec sm" onclick="document.querySelectorAll('.progchk').forEach(c=>c.checked=false);contarProg()">Desmarcar todos</button></div>
    <ul class="list card" style="padding:4px 12px">${itens.map((x, i) => `<li class="item ${x.nota ? 'off' : ''}" style="cursor:default">
      <input type="checkbox" class="progchk" data-i="${i}" ${x.marcado ? 'checked' : ''} ${x.nota ? 'disabled' : ''} onchange="contarProg()">
      <div class="main"><div class="d">${esc(x.desc)}</div><div class="s">${fmtData(x.data)} · ${esc(x.r.cat)} · ${esc(x.r.forma)}${x.nota ? ` · <b>${x.nota}</b>` : ''}</div></div>
      <input class="i mini" id="progv${i}" inputmode="decimal" value="${String(x.r.valor).replace('.', ',')}" ${x.nota ? 'disabled' : ''}></li>`).join('')}</ul>
    <button class="btn" id="progBtn" style="width:100%" onclick="salvarProgramacao()"></button>` : '<div class="muted">Nenhum lançamento neste mês para copiar.</div>'}`);
  contarProg();
}
function contarProg(){ const n = document.querySelectorAll('.progchk:checked').length, b = $('#progBtn'); if (b){ b.textContent = n ? `Programar ${n} lançamento(s)` : 'Nada marcado'; b.disabled = !n; } }
async function salvarProgramacao(){
  const lista = [];
  for (const c of document.querySelectorAll('.progchk:checked')){
    const x = S._prog[+c.dataset.i], v = parseValor($('#progv' + c.dataset.i).value);
    if (!(v > 0)) return toast(`Valor inválido em "${x.desc}"`);
    lista.push({ data: x.data, desc: x.desc, cat: x.r.cat, tipo: normTipo(x.r.tipo), forma: x.r.forma, status: x.r.status === 'Previsão' ? 'Previsão' : 'Programado', valor: v, obs: x.r.obs || '' });
  }
  const b = $('#progBtn'); b.disabled = true; b.textContent = 'Gravando…';
  try {
    const guardado = await inserirNovos(lista);
    $('#sheet')?.remove();
    S.mes = ym(lista[0].data); render();
    toast(guardado ? 'Sem internet: guardados no aparelho, serão enviados depois' : `${lista.length} lançamento(s) programado(s) ✓`, 3500);
  } catch(e){ b.disabled = false; b.textContent = 'Tentar de novo'; toast('Erro: ' + e.message, 5000); }
}

/* Fatura do cartão no mês */
function abrirFatura(mes){
  const rs = S.rows.filter(r => r.data && ym(r.data) === mes && normTipo(r.tipo) === 'Saída' && r.forma === 'Cartão')
    .sort((a,b) => a.data === b.data ? a.row - b.row : (a.data < b.data ? -1 : 1));
  const tot = rs.reduce((s,r) => s + r.valor, 0), pago = rs.filter(r => r.status === 'Pago').reduce((s,r) => s + r.valor, 0);
  const porCat = {}; rs.forEach(r => porCat[r.cat] = (porCat[r.cat] || 0) + r.valor);
  const ant = resumoMes(addMes(mes, -1)).cartao;
  abrirSheet(`<h3>💳 Cartão — ${nomeMes(mes)}${fechar}</h3>
    <div class="kpis">
      <div class="kpi big"><div class="l">Total no mês (${rs.length} lançamentos)</div><div class="v">${fmtBRL(tot)}</div>
        <div class="small muted">${ant ? `Mês anterior: ${fmtBRL(ant)} (${tot >= ant ? '+' : '−'}${fmtBRL(Math.abs(tot - ant))})` : ''}</div></div>
      <div class="kpi"><div class="l">Pago</div><div class="v">${fmtBRL(pago)}</div></div>
      <div class="kpi"><div class="l">Programado / previsto</div><div class="v">${fmtBRL(tot - pago)}</div></div>
    </div>
    ${rs.length ? `<div class="card"><h2>Por categoria</h2><div class="bars">${barras(porCat)}</div></div>
    <div class="card" style="padding:4px 12px"><ul class="list">${rs.map(r => itemHTML(r, { noclick: true })).join('')}</ul></div>` : '<div class="muted">Nenhuma compra no cartão neste mês.</div>'}
    <p class="small muted">Considera as saídas com forma "Cartão" pela data lançada, igual ao quadro 💳 CARTÃO do Dashboard.</p>`);
}

/* Limites por categoria */
function abrirLimites(){
  if (S.mode === 'graph' && !S.limitesOk){
    abrirSheet(`<h3>🎯 Limites por categoria${fechar}</h3>
      <p>Defina quanto quer gastar por mês em cada categoria. O app avisa quando chegar a 90% e quando passar.</p>
      <p class="small muted">Para os limites valerem no PC e no celular, o app vai criar uma aba <b>"Limites"</b> na sua planilha, com: Categoria, Limite mensal, Previsto no mês atual e Disponível. Você também pode editar os limites direto nessa aba.</p>
      <button class="btn" id="limCriar" style="width:100%" onclick="criarLimitesUI()">Criar aba Limites na planilha</button>`);
    return;
  }
  const cats = S.mode === 'graph' ? Object.keys(S.limitesRow) : CATS_LIMITE;
  const gasto = resumoMes(ym(today())).porCat;
  abrirSheet(`<h3>🎯 Limites mensais${fechar}</h3>
    <p class="small muted" style="margin-top:0">Deixe em branco a categoria sem limite. O valor ao lado é o previsto para ${MESES_LONGO[new Date().getMonth()].toLowerCase()} (pago + programado).</p>
    <ul class="list card" style="padding:4px 12px">${cats.map(c => `<li class="item" style="cursor:default"><div class="main"><div class="d">${esc(c)}</div><div class="s">previsto: ${fmtBRL(gasto[c] || 0)}</div></div>
      <input class="i mini limv" data-c="${esc(c)}" inputmode="decimal" placeholder="sem limite" value="${S.limites[c] ? String(S.limites[c]).replace('.', ',') : ''}"></li>`).join('')}</ul>
    <button class="btn" id="limBtn" style="width:100%" onclick="salvarLimitesUI()">Salvar limites</button>`);
}
async function criarLimitesUI(){
  const b = $('#limCriar'); b.disabled = true; b.textContent = 'Criando aba…';
  try { await criarAbaLimites(); await carregarLimites(); toast('Aba "Limites" criada ✓'); abrirLimites(); }
  catch(e){ b.disabled = false; b.textContent = 'Tentar de novo'; toast('Erro: ' + e.message, 5000); }
}
async function salvarLimitesUI(){
  const valores = {};
  for (const i of document.querySelectorAll('.limv')){
    const t = i.value.trim(); if (!t){ valores[i.dataset.c] = ''; continue; }
    const v = parseValor(t); if (!(v > 0)) return toast(`Limite inválido em ${i.dataset.c}`);
    valores[i.dataset.c] = v;
  }
  const b = $('#limBtn'); b.disabled = true; b.textContent = 'Salvando…';
  try {
    if (S.mode === 'graph') await gravarLimites(valores);
    else S.limites = Object.fromEntries(Object.entries(valores).filter(([, v]) => v > 0));
    $('#sheet')?.remove(); toast('Limites salvos ✓'); render();
  } catch(e){ b.disabled = false; b.textContent = 'Tentar de novo'; toast('Erro: ' + e.message, 5000); }
}

/* ---------------- configurações / login ---------------- */
function abrirConfig(){
  const conta = msalApp?.getActiveAccount();
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="sheet"><h3>Configurações<button class="iconbtn" onclick="$('#sheet').remove()">✕</button></h3>
    ${S.mode === 'graph' ? `<p>Conectado como <b>${esc(conta?.username || '')}</b><br><span class="small muted">Arquivo: OneDrive${esc(FILE_PATH)} · ${S.rows.length} lançamentos · ${S.emptyRows.length} linhas livres na tabela</span></p>
      <button class="btn sec" onclick="sair()">Sair da conta</button>` :
      `<p>Você está no modo demonstração.</p><button class="btn" onclick="lsSet('cf_demo',null);location.reload()">Conectar à minha planilha</button>`}
    <p class="small muted" style="margin-top:16px">Os lançamentos são gravados direto na aba ${esc(S.sheetName)} (Tabela1). Fórmulas como "Saldo projetado" e "Categoria Dashboard" continuam sendo calculadas pelo Excel.</p>
    ${!CLIENT_ID && S.mode==='graph' ? `<button class="btn sec sm" onclick="lsSet('cf_clientId',null);location.reload()">Trocar ID do aplicativo</button>` : ''}
  </div>`;
  document.body.appendChild(bg);
}
async function sair(){ lsSet('cf_tab',null); lsSet('cf_cache',null); await msalApp.logoutRedirect({ account: msalApp.getActiveAccount() }); }
async function recarregar(){
  if (S.mode !== 'graph') return toast('Modo demonstração');
  S.loading = true; render();
  try { await carregarGraph(); } catch(e){ toast(isOffline(e) ? 'Sem internet — mostrando os dados guardados' : 'Erro: ' + e.message, 5000); }
  S.loading = false; render();
  enviarFila();
}
function telaInicial(msg){
  const temId = !!clientId();
  $('#root').innerHTML = `<div class="wrap"><div class="center">
    <div style="font-size:48px">💰</div><h1 style="margin:0">Controle Financeiro</h1>
    ${msg ? `<div class="alert bad" style="max-width:420px">${esc(msg)}</div>` : ''}
    ${temId ? `<p class="muted" style="max-width:360px">Entre com a conta Microsoft onde está a planilha <b>Controle Financeiro.xlsx</b>.</p>
      <button class="btn" onclick="entrar()">Entrar com a conta Microsoft</button>` :
    `<p class="muted" style="max-width:380px">Primeira vez? Cole o <b>ID do aplicativo (cliente)</b> criado no portal da Microsoft (o passo a passo está no LEIA-ME).</p>
      <input class="i" id="cid" placeholder="ex.: 1a2b3c4d-…" style="max-width:380px">
      <button class="btn" onclick="const v=$('#cid').value.trim(); if(!/^[0-9a-f-]{36}$/i.test(v)) return toast('ID inválido'); lsSet('cf_clientId',v); location.reload()">Salvar e continuar</button>`}
    <button class="btn sec" onclick="lsSet('cf_demo','1');location.reload()">Ver demonstração</button>
  </div></div>`;
}
async function entrar(){ await msalApp.loginRedirect({ scopes: SCOPES }); }

/* ---------------- início ---------------- */
(async function main(){
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (lsGet('cf_demo')){
    S.mode = 'demo'; S.rows = dadosDemo(); S.limites = { 'Lazer': 300, 'Alimentação': 1200 }; S.limitesOk = true; render(); return;
  }
  window.addEventListener('online', () => { if (S.mode === 'graph') recarregar(); });
  if (!window.msal) return telaInicial('Não foi possível carregar a biblioteca de login da Microsoft. Verifique a internet.');
  if (!clientId()) return telaInicial();
  $('#root').innerHTML = '<div class="center"><div class="spinner"></div><div class="muted">Conectando…</div></div>';
  try {
    const logado = await initMsal();
    if (!logado) return telaInicial();
    S.mode = 'graph';
    $('#root').innerHTML = '<div class="center"><div class="spinner"></div><div class="muted">Lendo a planilha…</div></div>';
    try { await carregarGraph(); }
    catch(e){
      // sem internet: usa a última cópia guardada no aparelho
      let cache = null; try { cache = JSON.parse(lsGet('cf_cache')); } catch(_){}
      if (!(isOffline(e) && cache)) throw e;
      Object.assign(S, { rows: cache.rows, emptyRows: cache.emptyRows, sheetName: cache.sheetName, limites: cache.limites || {}, limitesRow: cache.limitesRow || {},
        limitesOk: Object.keys(cache.limitesRow || {}).length > 0, offlineDesde: cache.t });
      aplicarFila();
    }
    render();
    enviarFila();
  } catch(e){
    console.error(e);
    telaInicial('Erro: ' + (e.errorMessage ? `${e.errorCode} — ${e.errorMessage}` : e.message));
  }
})();
</script>
