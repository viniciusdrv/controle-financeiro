<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<title>Controle Financeiro</title>
<script>
/* Tema: "auto" (sem escolha salva) segue o aparelho; senão usa o escolhido nos Ajustes. Roda antes do CSS para não piscar. */
window.aplicarTema = function(){
  let t = null; try { t = localStorage.getItem('cf_tema'); } catch(e) {}
  document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
};
aplicarTema();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { aplicarTema(); window.aoMudarTema && window.aoMudarTema(); });
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f7; --card:#ffffff; --card2:#f7f8fa; --text:#0f172a; --muted:#64748b; --line:#e6e9ee;
  --brand:#0f766e; --brand-soft:#e0f2ef; --on-brand:#ffffff;
  --pos:#15803d; --neg:#dc2626; --warn:#c2410c;
  --pos-soft:#e8f6ec; --neg-soft:#fdecec; --warn-soft:#fff3e6;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --shadow-up:0 8px 30px rgba(15,23,42,.12);
  --hero1:#0f766e; --hero2:#134e4a;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0e13; --card:#141922; --card2:#1a202b; --text:#e8edf4; --muted:#8b97a8; --line:#232a36;
  --brand:#2dd4bf; --brand-soft:#11302d; --on-brand:#042f2b;
  --pos:#4ade80; --neg:#f87171; --warn:#fb923c;
  --pos-soft:#10291b; --neg-soft:#331717; --warn-soft:#33210f;
  --shadow:0 1px 0 rgba(255,255,255,.02); --shadow-up:0 8px 30px rgba(0,0,0,.5);
  --hero1:#0f5f58; --hero2:#0d2f2c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button,input,select,textarea{font:inherit;color:inherit}
.ico{display:block;flex:0 0 auto}
.wrap{max-width:760px;margin:0 auto;padding:4px 16px calc(110px + env(safe-area-inset-bottom))}

/* topo */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:760px;margin:0 auto}
header.top .logo{width:30px;height:30px;border-radius:9px;flex:0 0 auto}
header.top h1{font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
header.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.iconbtn{border:0;background:var(--card);color:var(--text);width:38px;height:38px;display:grid;place-items:center;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn:hover{background:var(--card2)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn.plain{background:transparent;box-shadow:none}

/* cartões e seções */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 12px;font-weight:650;letter-spacing:-.01em;color:var(--text)}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px} .h2row h2{margin:0}
.h2row .sub{font-size:12.5px;color:var(--muted);font-weight:500}

/* destaque do saldo */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 16px;margin:4px 0 14px;color:#fff;background:linear-gradient(140deg,var(--hero1),var(--hero2));box-shadow:0 10px 30px rgba(15,118,110,.25)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.hero .l{font-size:13px;opacity:.8;font-weight:500}
.hero .v{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px;line-height:1.15}
.hero .proj{font-size:13.5px;opacity:.9;margin:-6px 0 12px} .hero .proj b{font-weight:650}
.hero .pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600}
.hero .pill i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.hero .pill.warn i{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.25)} .hero .pill.bad i{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.3)}
.hero .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.hero .grid span{display:block;font-size:11.5px;opacity:.75} .hero .grid b{display:block;font-size:14.5px;font-weight:650;margin-top:1px;white-space:nowrap}

/* indicadores */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px} .kpi .v{font-size:18px;font-weight:700;margin-top:3px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.big{grid-column:1/-1} .kpi.big .v{font-size:24px}
.kpi.link{cursor:pointer} .kpi.link:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)} .kpi.big{grid-column:span 2}}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;margin-bottom:12px;font-weight:550;font-size:14px;background:var(--neg-soft);color:var(--neg)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .small{font-size:12.5px}

/* listas */
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item.off{opacity:.45}
.item .main{flex:1;min-width:0}
.item .d{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.item .d .tx{overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.item .s b{color:var(--text);font-weight:650}
.item .s .badge{margin-right:6px;vertical-align:1px}
.item .val{font-weight:650;white-space:nowrap;text-align:right}
.item .val small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--muted);flex:0 0 auto}
.badge.Programado{background:var(--brand-soft);color:var(--brand)} .badge.Previsão{background:var(--warn-soft);color:var(--warn)}
.paybtn{border:1px solid var(--line);background:var(--card);color:var(--pos);border-radius:50%;width:34px;height:34px;padding:0;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.paybtn:hover{background:var(--pos-soft);border-color:transparent}
.regbtn{border:0;background:var(--brand-soft);color:var(--brand);border-radius:11px;height:34px;padding:0 12px;font-size:13px;font-weight:650;cursor:pointer;flex:0 0 auto}
.regbtn:hover{filter:brightness(.97)}
.grouph{font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 4px 6px;display:flex;justify-content:space-between}
.grouph:first-child{margin-top:4px}

/* botões e formulários */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:650;cursor:pointer;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)} .btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
label.f{display:block;margin-bottom:12px} label.f span{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:5px}
input.i,select.i{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--card);font-size:16px;appearance:none;-webkit-appearance:none}
select.i{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input.i:focus,select.i:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
input.mini{width:108px;padding:8px 10px;font-size:15px;text-align:right;flex:0 0 auto}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);flex:0 0 auto}
.valorbox{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 14px}
.valorbox span{font-size:20px;font-weight:600;color:var(--muted)}
.valor{border:0!important;background:transparent!important;box-shadow:none!important;font-size:40px!important;font-weight:700;text-align:center;width:220px!important;padding:0!important;letter-spacing:-.02em}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.lbl{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:5px}

/* tipo do lançamento: cor clara da janela (--tint) e cor de destaque (--accent) */
.t-saida{--tint:#fdf3f3;--accent:#dc2626} .t-entrada{--tint:#eff8f2;--accent:#15803d}
.t-retirada{--tint:#fdf8e6;--accent:#b7791f} .t-invest{--tint:#eff5fe;--accent:#2563eb}
:root[data-theme="dark"] .t-saida{--tint:#211619;--accent:#f87171} :root[data-theme="dark"] .t-entrada{--tint:#122019;--accent:#4ade80}
:root[data-theme="dark"] .t-retirada{--tint:#211d10;--accent:#facc15} :root[data-theme="dark"] .t-invest{--tint:#121a2a;--accent:#60a5fa}
.sheet.tipado{background:var(--tint);transition:background .25s}
.sheet.tipado .btn:not(.sec):not(.danger){background:var(--accent);color:#fff}
:root[data-theme="dark"] .sheet.tipado .btn:not(.sec):not(.danger){color:#0b0e13}
.sheet.tipado .valor,.sheet.tipado .valorbox span{color:var(--accent)}
.sheet.tipado input.i:focus,.sheet.tipado select.i:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tipo-tile{border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));background:var(--tint);border-radius:18px;padding:16px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--text)}
.tipo-tile:hover{border-color:var(--accent)}
.tipo-tile .ti{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tipo-tile b{font-size:16px;font-weight:700} .tipo-tile small{color:var(--muted);font-size:12.5px;line-height:1.35}
.tipochip{display:inline-flex;align-items:center;gap:8px;border:0;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:700;font-size:14px;border-radius:99px;padding:6px 13px 6px 7px;cursor:pointer;margin-bottom:4px}
.tipochip .ti{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,transparent)}
.tipochip small{font-weight:500;opacity:.8;font-size:12.5px}
/* calendário (Lançamentos → Calendário) */
.vistas{display:flex;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cal .d{min-height:54px;border-radius:12px;padding:6px 2px 4px;text-align:center;position:relative;cursor:pointer;border:1.5px solid transparent;background:transparent;color:var(--text);font:inherit;min-width:0}
.cal .d:hover{background:var(--card2)}
.cal .d.fora{opacity:.3;cursor:default;background:transparent}
.cal .d .n{font-size:13.5px;font-weight:600;line-height:1}
.cal .d.warn{background:var(--warn-soft)} .cal .d.bad{background:var(--neg-soft)}
.cal .d.sel{background:var(--card2);border-color:var(--line)}
.cal .d.hoje{border-color:var(--brand)}
.cal .dots{display:flex;justify-content:center;align-items:center;gap:3px;margin-top:6px;min-height:7px}
.cal .dot,.legenda .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:0 0 auto}
.dot.vaz{background:transparent;border:1.5px solid var(--c)} .dot.prev{background:transparent;border:1.5px dashed var(--c)}
.cal .mk{position:absolute;top:3px;right:3px;color:var(--muted)}
.cal .tot{display:none;font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:12px}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i.bg{width:12px;height:12px;border-radius:4px}
.dia-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px} .dia-head h2{margin:0}
.calgrid{display:grid;gap:0}
.dash.lista{display:flex;flex-direction:column} .dash.lista .esq{display:contents}
.dash.lista .col-a{order:0} .dash.lista .col-c{order:1} .dash.lista .col-b{order:2} .dash.lista.modo-cal .col-c{order:3;margin-top:4px}
@media (min-width:1024px){ .cal .d{min-height:80px} .cal .tot{display:block} }
@media (min-width:1280px){ .calgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start} }
.card.sug{background:var(--tint);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.card.sug h2{display:flex;align-items:center;gap:8px;color:var(--accent)}
.card.sug .v{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.card.sug .btn{background:var(--accent);color:#fff} :root[data-theme="dark"] .card.sug .btn{color:#0b0e13}

/* menu inferior */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;width:calc(100% - 24px);max-width:480px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-up);display:flex;align-items:center;padding:6px}
nav.tabs button{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px}
nav.tabs button.on{color:var(--brand);font-weight:650}
nav.tabs button.add{flex:0 0 auto;width:56px;height:56px;margin:-22px 6px 0;border-radius:18px;background:var(--brand);color:var(--on-brand);box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 45%,transparent);justify-content:center}
nav.tabs button.add:hover{filter:brightness(1.06)}

/* navegação de mês, chips, barras, tabelas, gráficos */
.monthnav{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.monthnav strong{flex:1;text-align:center;font-size:16px;font-weight:650}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.searchbox{position:relative;margin-bottom:10px} .searchbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)} .searchbox input{padding-left:40px}
.bars .b{margin-bottom:12px} .bars .b:last-child{margin-bottom:0}
.bars .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px}
.bars .t span{display:flex;align-items:center;gap:8px;font-weight:500} .bars .t i{width:8px;height:8px;border-radius:3px;background:var(--c,var(--brand));flex:0 0 auto}
.bars .t b{font-weight:650;white-space:nowrap}
.bars .track{height:6px;background:var(--card2);border-radius:99px;overflow:hidden} .bars .fill{height:100%;background:var(--c,var(--brand));border-radius:99px}
.bars .fill.warn{background:var(--warn)} .bars .fill.bad{background:var(--neg)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap} table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
table.t tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;margin:0 -4px}
.chartbox{position:relative;height:210px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:-4px 0 8px}
.legend span{display:flex;align-items:center;gap:6px} .legend i{width:14px;height:3px;border-radius:2px;background:var(--brand)} .legend i.d{background:repeating-linear-gradient(90deg,var(--brand) 0 4px,transparent 4px 7px)}
.legend{flex-wrap:wrap;row-gap:4px} .legend i.r{height:1px;background:repeating-linear-gradient(90deg,var(--muted) 0 2px,transparent 2px 5px)} .legend i.p{width:7px;height:7px;border-radius:50%}

/* janelas, avisos */
.sheet-bg{position:fixed;inset:0;background:rgba(8,12,18,.45);backdrop-filter:blur(2px);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:26px;padding-top:18px}.sheet::before{display:none}}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:.6}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:30;font-weight:600;font-size:14px;max-width:90vw;text-align:center;box-shadow:var(--shadow-up)}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}

<script>
/* ============================== CONFIGURAÇÃO ============================== */
const CLIENT_ID = '5f1e7927-b93f-4d16-9d87-628370dd7e12'; // registro do app no portal Microsoft Entra

/* ============================== utilidades ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const numBR = n => String(n).replace('.', ',');                 // número → texto de campo ("12,5")
const compacto = v => Math.abs(v) >= 1000 ? (v/1000).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + ' mil' : v.toLocaleString('pt-BR');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const soma = arr => arr.reduce((s, r) => s + r.valor, 0);
const pad = n => String(n).padStart(2,'0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const fmtData = iso => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}` : '';
const fmtDataLonga = iso => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}` : '';
const ym = iso => iso.slice(0,7);
const serialToIso = s => { const d = new Date(Date.UTC(1899,11,30) + Math.round(Number(s))*864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const isoToSerial = iso => { const [y,m,d] = iso.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d) - Date.UTC(1899,11,30))/864e5); };
const sinal = t => (t === 'Entrada' || t === 'Retirada') ? 1 : -1; // mesma regra da planilha
const statusPorData = iso => iso > today() ? 'Programado' : 'Pago';
const porData = (a, b) => a.data === b.data ? a.row - b.row : (a.data < b.data ? -1 : 1); // como a planilha ordena o saldo
function parseValor(v){
  v = String(v||'').trim().replace(/[R$\s]/g,'');
  if (v.includes(',')) v = v.replace(/\./g,'').replace(',','.');
  const n = parseFloat(v); return isNaN(n) ? NaN : Math.round(n*100)/100;
}
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
const opt = (arr, sel) => arr.map(v => `<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('');
function marcarSeg(id, v){ document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
const segAtual = id => document.querySelector(`#${id} button.on`)?.dataset.v || '';
/* Botão "ocupado" enquanto grava; em caso de erro volta como "Tentar de novo" */
async function comBotao(sel, texto, fn){
  const b = $(sel); if (b){ b.disabled = true; b.textContent = texto; }
  try { await fn(); }
  catch(e){ if (b){ b.disabled = false; b.textContent = 'Tentar de novo'; } toast('Erro: ' + e.message, 5000); }
}

/* meses */
const mesAbrev = m => MESES[+m.slice(5,7) - 1];
const mesLongo = m => MESES_LONGO[+m.slice(5,7) - 1];
const nomeMes = m => `${mesLongo(m)} ${m.slice(0,4)}`;
const mesCurto = iso => `${mesAbrev(iso).toLowerCase()}${iso.slice(0,4) !== String(new Date().getFullYear()) ? '/' + iso.slice(2,4) : ''}`;
function addMes(m, n){ const [y,mm] = m.split('-').map(Number); const d = new Date(y, mm-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function addMesesData(iso, k){
  const [y, m, d] = iso.split('-').map(Number);
  return isoLocal(new Date(y, m - 1 + k, Math.min(d, new Date(y, m + k, 0).getDate())));
}
const ultimoDiaMes = m => { const [y, mm] = m.split('-').map(Number); return isoLocal(new Date(y, mm, 0)); };
const ehUltimoDia = iso => !!iso && iso === ultimoDiaMes(ym(iso));

/* cartão, previsões e parcelas */
const ehCartao = r => r.forma === 'Cartão' && r.tipo === 'Saída';
const dataFatura = m => `${m}-${pad(CARTAO_VENCIMENTO)}`;
const faturaSugerida = (iso = today()) => +iso.slice(8,10) >= CARTAO_MELHOR_DIA ? addMes(ym(iso), 1) : ym(iso);
/* Onde a data é escolhida: dia exato, mês da fatura (cartão) ou só o mês (previsão) */
const modoDe = (tipo, forma, status) => forma === 'Cartão' && tipo === 'Saída' ? 'fatura' : status === 'Previsão' ? 'mes' : 'dia';
function resolverData({ modo, dia, mes, original }){
  if (modo === 'dia') return dia;
  if (original && ym(original) === mes) return original; // editando sem trocar o mês: mantém a data original
  return modo === 'fatura' ? dataFatura(mes) : ultimoDiaMes(mes);
}
/* "MBA 2/12" → { base:'MBA', atual:2, total:12 } */
function parcela(desc){ const m = String(desc).match(/^(.*?)\s*(\d+)\/(\d+)$/); return m ? { base: m[1].trim(), atual: +m[2], total: +m[3] } : null; }
const comParcela = (base, i, n) => `${base} ${i}/${n}`;
const baseDesc = d => parcela(d)?.base ?? d.trim();
/* Se a data cair no último dia do mês (previsão), continua no último dia nos meses seguintes */
const mesesDepois = (iso, k) => ehUltimoDia(iso) ? ultimoDiaMes(addMes(ym(iso), k)) : addMesesData(iso, k);

/* ============================== ícones e categorias ============================== */
const ICONES = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  chart:'<path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/>',
  sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  refresh:'<path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  repeat:'<path d="m17 2 3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  wifioff:'<path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.3-1.6M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 10.7 5M12 20h.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/>',
  cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.4 11.2a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 2-1.5L21.5 7H6"/>',
  heart:'<path d="M12 20s-7.5-4.6-9.3-9.2A5 5 0 0 1 12 6.2a5 5 0 0 1 9.3 4.6C19.5 15.4 12 20 12 20z"/>',
  fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/>',
  scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1 20 20M8.1 15.9 20 4"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',

  wallet:'<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M21 9h-5a3 3 0 0 0 0 6h5z"/>',
  swap:'<path d="M7 7h13l-4-4M17 17H4l4 4"/>',
  health:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
  copy:'<rect x="8" y="8" width="13" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16H8"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/>',

const ic = (n, s = 20, w = 1.9) => `<svg class="ico" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[n] || ''}</svg>`;

  'Combustível':['fuel','#ef4444'], 'Cuidados Pessoais':['scissors','#d946ef'], 'Diversos':['box','#94a3b8'], 'Educação':['book','#3b82f6'],
  'Investimento':['trend','#0ea5e9'], 'Lazer':['smile','#f97316'], 'Moradia':['home','#14b8a6'], 'Renda':['wallet','#22c55e'],

};

/* ============================== estado ============================== */
const S = {

  mesMin: '',            // primeiro mês exibido (INICIO_CONTROLE com a planilha real)
  rows: [],              // lançamentos preenchidos (+ os guardados offline, com row negativo)

  tab: lsGet('cf_tab') || 'home',

  offlineDesde: null,
  bloqueioExcel: false,          // Microsoft recusou abrir a planilha (ver avisoExcelHTML)            // mostrando a cópia guardada no aparelho (sem internet)
  fila: lerFila(),               // lançamentos feitos sem internet, aguardando envio
  _calc: null, _resumo: new Map(), _meses: null // derivados, recalculados a cada render
};
let charts = {};
const linha = row => S.rows.find(r => r.row === row);
const temAbaLimites = () => Object.keys(S.limitesRow).length > 0;

/* ============================== Microsoft Graph ============================== */
let msalApp = null, itemId = lsGet('cf_itemId');
const SCOPES = ['Files.ReadWrite'];

async function initMsal(){
  msalApp = new msal.PublicClientApplication({
    auth:{ clientId: CLIENT_ID, authority:'https://login.microsoftonline.com/consumers', redirectUri: location.origin + location.pathname },
    cache:{ cacheLocation:'localStorage' }
  });
  await msalApp.initialize();
  const res = await msalApp.handleRedirectPromise();
  if (res && res.account) msalApp.setActiveAccount(res.account);
  else { const a = msalApp.getAllAccounts(); if (a.length) msalApp.setActiveAccount(a[0]); }
  return !!msalApp.getActiveAccount();
}
function erroOffline(){ return Object.assign(new Error('Sem conexão com a internet'), { offline:true }); }
const isOffline = e => !!(e && (e.offline || !navigator.onLine));
async function token(){
  const account = msalApp.getActiveAccount();
  try { return (await msalApp.acquireTokenSilent({ scopes:SCOPES, account })).accessToken; }
  catch(e){
    if (!navigator.onLine || /network|endpoints_resolution/i.test(e.errorCode || '')) throw erroOffline();
    await msalApp.acquireTokenRedirect({ scopes:SCOPES, account }); throw new Error('Redirecionando para login…');
  }
}
async function graph(method, path, body, tentativa=0){
  const tk = await token();
  let r;
  try {
    r = await fetch('https://graph.microsoft.com/v1.0' + path, {
      method, headers:{ Authorization:'Bearer ' + tk, 'Content-Type':'application/json' },
      body: body ? JSON.stringify(body) : (method === 'POST' ? '{}' : undefined)
    });
  } catch(e){ throw erroOffline(); }
  if ((r.status === 429 || r.status >= 500) && tentativa < 2){ await new Promise(ok=>setTimeout(ok, 1200*(tentativa+1))); return graph(method, path, body, tentativa+1); }
  if (!r.ok){
    let m = r.status + '', code = ''; try{ const j = await r.json(); m = j.error?.message || m; code = j.error?.code || ''; }catch(e){}
    // falha conhecida da Microsoft em contas pessoais: libera depois que a planilha é aberta uma vez no Excel online
    if (code === 'FileOpenUserUnauthorized'){ S.bloqueioExcel = true; m = 'A Microsoft bloqueou a abertura da planilha. Abra-a uma vez no Excel online e tente de novo.'; }
    throw Object.assign(new Error(m), { status: r.status, code });
  }
  return r.status === 204 ? null : r.json();
}
async function getItemId(){
  if (itemId) return itemId;
  const p = FILE_PATH.split('/').map(encodeURIComponent).join('/');
  itemId = (await graph('GET', `/me/drive/root:${p}?$select=id`)).id;
  lsSet('cf_itemId', itemId);
  return itemId;
}
/* endereço da planilha no Excel online (para o aviso de bloqueio) */
async function garantirWebUrl(){ if (lsGet('cf_webUrl')) return; const it = await graph('GET', `/me/drive/items/${await getItemId()}?$select=webUrl`); lsSet('cf_webUrl', it.webUrl); }
function avisoExcelHTML(){
  const url = lsGet('cf_webUrl');
  return `<div class="demo-banner" style="flex-wrap:wrap;background:var(--neg-soft);color:var(--neg)">${ic('alert',16)} A Microsoft bloqueou a leitura da planilha pelo app (falha conhecida dela). Abra a planilha uma vez no Excel online e toque em Tentar de novo.
    <span style="display:flex;gap:8px;width:100%;justify-content:center;margin-top:6px">${url ? `<a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">Abrir no Excel online</a>` : ''}<button class="btn sec sm" onclick="recarregar()">Tentar de novo</button></span></div>`;
}
const wb = async () => `/me/drive/items/${await getItemId()}/workbook`;
const ws = async (nome = S.sheetName) => `${await wb()}/worksheets('${encodeURIComponent(nome)}')`;
const letra = i => String.fromCharCode(65 + i);

/* Lê a Tabela1: separa linhas preenchidas e vazias e descobre as colunas pelo cabeçalho */
async function carregarTabela(){
  const res = await graph('GET', `${await wb()}/tables('${TABLE_NAME}')/range?$select=address,values`);
  const [sheet, ref] = res.address.split('!');
  S.sheetName = sheet.replace(/^'|'$/g,'');
  const firstRow = parseInt(ref.match(/\d+/)[0], 10);
  const head = res.values[0].map(h => String(h).trim());
  const ix = n => head.indexOf(n);
  const c = { data:ix('Data'), desc:ix('Descrição'), cat:ix('Categoria'), tipo:ix('Tipo'), forma:ix('Forma'), status:ix('Status'), valor:ix('Valor'), obs:ix('Obs'), rec:ix('Recorrência') };
  // Data…Valor precisam estar juntas em A–G (são gravadas num bloco só); Obs e Recorrência são achadas pelo nome
  if (!ref.startsWith('A') || [c.data, c.desc, c.cat, c.tipo, c.forma, c.status, c.valor].some((v, i) => v !== i) || c.obs < 0)
    throw new Error('A estrutura da Tabela1 mudou: esperava Data, Descrição, Categoria, Tipo, Forma, Status e Valor em A–G, e uma coluna Obs.');
  S.col = { status: letra(c.status), obs: letra(c.obs), rec: c.rec >= 0 ? letra(c.rec) : null };
  const rows = [], empty = [];
  res.values.slice(1).forEach((v, i) => {
    const rowNum = firstRow + i + 1;
    if (v[c.data] === '' && v[c.desc] === '' && v[c.valor] === ''){ empty.push(rowNum); return; }
    rows.push({
      row: rowNum,
      data: typeof v[c.data] === 'number' ? serialToIso(v[c.data]) : '',
      desc: String(v[c.desc]), cat: String(v[c.cat]),
      tipo: String(v[c.tipo]) === 'Saida' ? 'Saída' : String(v[c.tipo]), // normaliza grafia antiga uma vez só
      forma: String(v[c.forma]), status: String(v[c.status]), valor: Number(v[c.valor]) || 0,
      obs: String(v[c.obs] ?? ''), rec: c.rec >= 0 ? String(v[c.rec] ?? '') : ''
    });
  });
  S.rows = rows; S.emptyRows = empty;
  aplicarFila();
}
async function carregarLimites(){
  try {
    const res = await graph('GET', `${await ws('Limites')}/range(address='A1:B60')?$select=values`);
    const lim = {}, pos = {};
    res.values.forEach((v, i) => {
      const c = String(v[0]).trim(); if (i === 0 || !c) return;
      pos[c] = i + 1; const n = Number(v[1]); if (v[1] !== '' && n > 0) lim[c] = n;
    });
    S.limites = lim; S.limitesRow = pos;
  } catch(e){ if (isOffline(e)) throw e; S.limites = {}; S.limitesRow = {}; } // aba ainda não existe
}
/* Carrega tabela e limites em paralelo; se o arquivo mudou de lugar, esquece o id guardado e tenta de novo */
async function carregarTudo(){
  try { await Promise.all([carregarTabela(), carregarLimites()]); }
  catch(e){
    if (e.status !== 404 || !lsGet('cf_itemId')) throw e;
    itemId = null; lsSet('cf_itemId', null);
    await Promise.all([carregarTabela(), carregarLimites()]);
  }
  S.offlineDesde = null; S.bloqueioExcel = false;
  if (!lsGet('cf_webUrl')) garantirWebUrl().catch(() => {});
  salvarCache();
}

/* Cópia local para abrir sem internet */
function salvarCache(){
  if (S.mode !== 'graph') return;
  const { sheetName, col, emptyRows, limites, limitesRow } = S;
  lsSet('cf_cache', JSON.stringify({ t: Date.now(), rows: S.rows.filter(r => !r.pendente), emptyRows, sheetName, col, limites, limitesRow }));
}
function restaurarCache(){
  let c = null; try { c = JSON.parse(lsGet('cf_cache')); } catch(e){}
  if (!c) return null;
  Object.assign(S, { rows: c.rows, emptyRows: c.emptyRows, sheetName: c.sheetName, col: c.col || S.col, limites: c.limites || {}, limitesRow: c.limitesRow || {} });
  aplicarFila();
  return c.t;
}

/* Escreve linhas contíguas a partir de "ini" (A–G, Obs e Recorrência). null = esvaziar a linha. */
async function escreverLinhas(ini, linhas, { novas = false } = {}){
  const fim = ini + linhas.length - 1, base = await ws();
  const faixa = (col, f) => graph('PATCH', `${base}/range(address='${col}${ini}:${col}${fim}')`, { values: linhas.map(f) });
  await graph('PATCH', `${base}/range(address='A${ini}:G${fim}')`, {
    values: linhas.map(l => l ? [isoToSerial(l.data), l.desc, l.cat, l.tipo, l.forma, l.status, l.valor] : Array(7).fill(''))
  });
  // linhas novas já estão vazias: só grava Obs/Recorrência se houver algo
  if (!novas || linhas.some(l => l?.obs)) await faixa(S.col.obs, l => [l?.obs || '']);
  if (S.col.rec && (!novas || linhas.some(l => l?.rec))) await faixa(S.col.rec, l => [l?.rec || '']);
}

/* ---- onde os dados são gravados: planilha (graph) ou memória (demo). As telas só chamam db().x() ---- */
const store = {
  graph: {
    async inserir(lista, { fresco = false } = {}){
      if (!fresco) await carregarTabela(); // estado mais recente: não sobrescrever nada que mudou no Excel
      if (S.emptyRows.length < lista.length) throw new Error(`A Tabela1 só tem ${S.emptyRows.length} linha(s) livre(s). Abra a planilha e aumente a tabela (arraste o canto inferior).`);
      const alvo = S.emptyRows.slice(0, lista.length);
      for (let i = 0; i < alvo.length; ){
        let j = i; while (j + 1 < alvo.length && alvo[j+1] === alvo[j] + 1) j++;
        await escreverLinhas(alvo[i], lista.slice(i, j + 1), { novas: true });
        i = j + 1;
      }
      // atualiza a memória sem reler a planilha
      lista.forEach((l, i) => S.rows.push({ ...l, row: alvo[i] }));
      S.emptyRows = S.emptyRows.slice(lista.length);
      salvarCache();
    },
    async atualizar(row, l){ await escreverLinhas(row, [l]); Object.assign(linha(row), l, { row }); salvarCache(); },
    async limpar(row){
      await escreverLinhas(row, [null]);
      S.rows = S.rows.filter(r => r.row !== row); S.emptyRows = [...S.emptyRows, row].sort((a, b) => a - b); salvarCache();
    },
    async marcarPago(row){ await graph('PATCH', `${await ws()}/range(address='${S.col.status}${row}')`, { values: [['Pago']] }); linha(row).status = 'Pago'; salvarCache(); },
    async salvarLimites(valores){ // { categoria: número ou '' }
      const linhas = Object.values(S.limitesRow);
      const ini = Math.min(...linhas), fim = Math.max(...linhas);
      const catDaLinha = Object.fromEntries(Object.entries(S.limitesRow).map(([c, r]) => [r, c]));
      const values = [];
      for (let r = ini; r <= fim; r++){ const c = catDaLinha[r]; values.push([c in valores ? valores[c] : (S.limites[c] || '')]); }
      await graph('PATCH', `${await ws('Limites')}/range(address='B${ini}:B${fim}')`, { values });
      Object.entries(valores).forEach(([c, v]) => { if (v > 0) S.limites[c] = v; else delete S.limites[c]; });
      salvarCache();
    }
  },
  demo: {
    async inserir(lista){ let m = Math.max(1, ...S.rows.map(r => r.row)); lista.forEach(l => S.rows.push({ ...l, row: ++m })); },
    async atualizar(row, l){ Object.assign(linha(row), l, { row }); },
    async limpar(row){ S.rows = S.rows.filter(r => r.row !== row); },
    async marcarPago(row){ linha(row).status = 'Pago'; },
    async salvarLimites(valores){ S.limites = Object.fromEntries(Object.entries(valores).filter(([, v]) => v > 0)); }
  }
};
const db = () => store[S.mode];

/* Insere lançamentos novos; sem internet, guarda no aparelho. Retorna true se ficou guardado. */
async function inserirNovos(lista){
  try { await db().inserir(lista); return false; }
  catch(e){
    if (S.mode !== 'graph' || !isOffline(e)) throw e;
    S.fila = S.fila.concat(lista); salvarFila(); aplicarFila(); return true;
  }
}

/* ---- fila offline ---- */
function lerFila(){ try { return JSON.parse(lsGet('cf_fila') || '[]'); } catch(e){ return []; } }
const salvarFila = () => lsSet('cf_fila', S.fila.length ? JSON.stringify(S.fila) : null);
function aplicarFila(){ S.rows = S.rows.filter(r => !r.pendente).concat(S.fila.map((l, i) => ({ ...l, row: -(i + 1), pendente: true }))); }
async function enviarFila(fresco = false){
  const f = S.fila; if (!f.length || S.mode !== 'graph') return;
  try {
    S.rows = S.rows.filter(r => !r.pendente); // fora da memória enquanto vão para a planilha
    await store.graph.inserir(f, { fresco });
    S.fila = []; salvarFila(); aplicarFila();
    toast(`${f.length} lançamento(s) guardado(s) enviado(s) para a planilha ✓`); render();
  } catch(e){ aplicarFila(); if (!isOffline(e)) toast('Erro ao enviar lançamentos guardados: ' + e.message, 5000); }
}

  const n = CATS_LIMITE.length, fim = n + 1, T = 'Timeline!';

/* ============================== cálculos (mesmas regras do Dashboard) ============================== */
function calcular(){
  const hoje = today();
  const validos = S.rows.filter(r => r.data);
  const ord = [...validos].sort(porData);   // saldo projetado: por data e, no mesmo dia, pela linha
  let acc = 0;
  for (const r of ord){ if (r.status !== 'Marco zero') acc += sinal(r.tipo) * r.valor; r.saldo = Math.round(acc*100)/100; }
  const saldoDe = rs => rs.reduce((s, r) => s + sinal(r.tipo) * r.valor, 0);
  const dinheiro = saldoDe(validos.filter(r => r.data <= hoje && r.status !== 'Marco zero' && r.forma === 'Dinheiro'));
  const investido = soma(validos.filter(r => r.tipo === 'Investimento')) - soma(validos.filter(r => r.tipo === 'Retirada'));
  let menor = null;
  for (const r of ord) if (r.data >= hoje && (!menor || r.saldo < menor.saldo)) menor = r;
  const proxSal = ord.find(r => r.desc === 'Salário' && r.data > hoje);
  // saldo real: só o que está marcado como Pago (o que de fato já saiu/entrou na conta)
  const saldoReal = saldoDe(validos.filter(r => r.status === 'Pago' && r.forma !== 'Dinheiro'));
  // projetado para o fim do mês: inclui programados e previsões até o último dia do mês
  const fimMes = ultimoDiaMes(ym(hoje)), ateFim = ord.filter(r => r.data <= fimMes);
  const saldoFimMes = ateFim.length ? ateFim[ateFim.length - 1].saldo : null;
  // sugestão de investimento: investir hoje reduz todos os saldos futuros, então o limite é o menor saldo projetado
  // (que já desconta contas programadas e previsões) menos a reserva; arredondado para baixo, de 50 em 50
  const pior = menor ? menor.saldo : saldoReal;
  const sugestao = Math.max(0, Math.floor((Math.min(pior, saldoReal) - RESERVA_MINIMA) / 50) * 50);
  return { ord, saldoReal, saldoFimMes, fimMes, dinheiro, investido, patrimonio: saldoReal + investido + dinheiro, menor, proxSal, sugestao };
}
function resumoMes(mes){
  if (S._resumo.has(mes)) return S._resumo.get(mes);
  const rs = S.rows.filter(r => r.data && ym(r.data) === mes), sai = rs.filter(r => r.tipo === 'Saída');
  const porCat = {}; sai.forEach(r => porCat[r.cat] = (porCat[r.cat] || 0) + r.valor);
  const comSaldo = rs.filter(r => r.saldo != null);
  const res = {
    ent: soma(rs.filter(r => r.tipo === 'Entrada' || r.tipo === 'Retirada')), sai: soma(sai),
    inv: soma(rs.filter(r => r.tipo === 'Investimento' && r.status !== 'Marco zero')) /* acertos "Marco zero" não são movimento do mês */, cartao: soma(sai.filter(r => r.forma === 'Cartão')),
    pendente: soma(sai.filter(r => r.status !== 'Pago')), porCat,
    // o que sobra na conta: o investimento também sai da conta (o saldo projetado já desconta)
    get res(){ return this.ent - this.sai - this.inv; },
    menor: comSaldo.length ? comSaldo.reduce((a, b) => b.saldo < a.saldo ? b : a) : null
  };
  S._resumo.set(mes, res);
  return res;
}
function mesesComDados(){
  return S._meses ??= [...new Set(S.rows.filter(r => r.data).map(r => ym(r.data)))].filter(m => m >= S.mesMin).sort();
}

  if (!r.data) return '';
  if (ehCartao(r)) return `Fatura ${mesCurto(r.data)}`;
  if (r.status === 'Previsão') return `Previsto p/ ${mesCurto(r.data)}`;
  return semData ? '' : fmtData(r.data);
}
const badgeHTML = r => r.pendente ? `<span class="badge Previsão">${ic('clock',11,2.4)} envio</span>`
  : r.status !== 'Pago' ? `<span class="badge ${esc(r.status)}">${esc(r.status)}</span>` : '';
const acaoHTML = r => r.pendente || r.status === 'Pago' ? ''
  : r.status === 'Previsão' ? `<button class="regbtn" aria-label="Registrar gasto de ${esc(r.desc)}" onclick="event.stopPropagation();abrirRegistro(${r.row})">Registrar</button>`

/* Compras no cartão da mesma fatura (mês) viram uma linha só; tocar nela abre a fatura. Só visual: na planilha nada muda. */
function agruparFaturas(rs){
  const porMes = {};
  rs.forEach(r => { if (r.data && ehCartao(r) && !r.pendente) (porMes[ym(r.data)] = porMes[ym(r.data)] || []).push(r); });
  const grupos = Object.entries(porMes).filter(([, it]) => it.length > 1);
  if (!grupos.length) return rs;
  const dentro = new Set(grupos.flatMap(([, it]) => it));
  return rs.filter(r => !dentro.has(r)).concat(grupos.map(([mes, itens]) => {
    const ult = [...itens].sort(porData).at(-1);
    return { grupo: true, mes, itens, tipo: 'Saída', valor: soma(itens), data: ult.data, row: ult.row, saldo: ult.saldo };
  }));
}

/* lista de lançamentos agrupada por dia (re-renderizada sozinha ao digitar na busca) */
function listaCorpoHTML(){
  const q = S.busca.trim().toLowerCase();
  let rs = q ? S.rows.filter(r => `${r.desc} ${r.cat} ${r.obs}`.toLowerCase().includes(q)) : S.rows.filter(r => r.data && ym(r.data) === S.mes);
  if (S.filtroCat) rs = rs.filter(r => r.cat === S.filtroCat);
  if (!q && !S.filtroCat) rs = agruparFaturas(rs); // busca e filtro mostram as compras do cartão uma a uma
  rs = [...rs].sort((a, b) => porData(b, a));
  const grupos = {}; rs.forEach(r => (grupos[r.data] = grupos[r.data] || []).push(r));
  if (!rs.length) return '<div class="empty">Nenhum lançamento.</div>';
  return Object.entries(grupos).map(([d, items]) => {
    const tot = items.reduce((s, r) => s + sinal(r.tipo) * r.valor, 0);
    const dia = cap(new Date(d + 'T12:00').toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short', ...(q ? { year:'numeric' } : {}) }).replace(/\./g,''));
    return `<div class="grouph"><span>${dia}</span><span>${tot >= 0 ? '+' : '−'}${fmtBRL(Math.abs(tot))}</span></div><div class="card" style="padding:2px 14px;margin-bottom:6px"><ul class="list">${items.map(r => linhaHTML(r, { saldo:true, semData:true })).join('')}</ul></div>`;
  }).join('');
}
/* ---- calendário do mês ---- */
const COR_TIPO = { 'Saída':'var(--neg)', 'Entrada':'var(--pos)', 'Investimento':'#3b82f6', 'Retirada':'#d4a017' };
function setVista(v){ S.vista = v; lsSet('cf_vista', v); if (v === 'cal') S.busca = ''; render(); }
/* lançamentos do mês exibido (respeitando o filtro de categoria), agrupados por dia */
function lancDoMes(){
  const g = {};
  S.rows.filter(r => r.data && ym(r.data) === S.mes && (!S.filtroCat || r.cat === S.filtroCat)).sort(porData).forEach(r => (g[r.data] = g[r.data] || []).push(r));
  return g;
}
/* saldo projetado ao fim de cada dia do mês (último saldo da linha do tempo até aquele dia) */
function saldosDoMes(dias){
  const ord = S._calc.ord, res = {}; let i = 0, ult = null;
  for (const d of dias){ while (i < ord.length && ord[i].data <= d) ult = ord[i++].saldo; res[d] = ult; }
  return res;
}
const diasDoMes = m => Array.from({ length: +ultimoDiaMes(m).slice(8) }, (_, i) => `${m}-${pad(i + 1)}`);
/* dia selecionado: o tocado; senão hoje (se for deste mês); senão o primeiro dia com lançamento */
function diaAtual(g){
  if (S.diaSel && ym(S.diaSel) === S.mes) return S.diaSel;
  if (ym(today()) === S.mes) return today();
  return Object.keys(g)[0] || `${S.mes}-01`;
}
function calendarioHTML(){
  const g = lancDoMes(), dias = diasDoMes(S.mes), saldos = saldosDoMes(dias), sel = diaAtual(g), hoje = today();
  const vazios = new Date(S.mes + '-01T12:00').getDay(); // 0 = domingo
  const salarios = new Set(S.rows.filter(r => r.desc === 'Salário' && r.data && ym(r.data) === S.mes).map(r => r.data));
  const celula = d => {
    const itens = g[d] || [], s = saldos[d], dia = +d.slice(8);
    const cls = ['d', d === hoje ? 'hoje' : '', d === sel ? 'sel' : '', s != null && s < 0 ? 'bad' : s != null && s < RESERVA_MINIMA ? 'warn' : ''].join(' ');
    // um pontinho por tipo de movimento (saída paga, entrada, saída programada…), não por lançamento; ajustes "Marco zero" não contam
    const tipos = [...new Set(itens.filter(r => r.status !== 'Marco zero').map(r => `${r.tipo}|${r.status === 'Previsão' ? 'prev' : r.status === 'Pago' ? '' : 'vaz'}`))];
    const dots = tipos.slice(0, 4).map(k => { const [t, est] = k.split('|'); return `<span class="dot ${est}" style="--c:${COR_TIPO[t] || 'var(--muted)'}"></span>`; }).join('');
    const tot = itens.reduce((a, r) => a + sinal(r.tipo) * r.valor, 0);
    const mk = salarios.has(d) ? ic('wallet', 12, 2.2) : dia === CARTAO_VENCIMENTO ? ic('card', 12, 2.2) : '';
    return `<button type="button" class="${cls}" onclick="selDia('${d}')" aria-label="${fmtDataLonga(d)}: ${itens.length} lançamento(s)">
      ${mk ? `<span class="mk">${mk}</span>` : ''}<div class="n">${dia}</div><div class="dots">${dots}</div>
      ${itens.length ? `<div class="tot">${tot >= 0 ? '+' : '−'}${compacto(Math.round(Math.abs(tot)))}</div>` : ''}</button>`;
  };
  const leg = (cls, cor, txt) => `<span><span class="dot ${cls}" style="--c:${cor}"></span>${txt}</span>`;
  return `<div class="cal">${['D','S','T','Q','Q','S','S'].map(x => `<div class="dw">${x}</div>`).join('')}
    ${'<div class="d fora"></div>'.repeat(vazios)}${dias.map(celula).join('')}</div>
    <div class="legenda">${leg('', 'var(--neg)', 'Pago')}${leg('vaz', 'var(--neg)', 'Programado')}${leg('prev', 'var(--neg)', 'Previsão')}
      ${leg('', 'var(--pos)', 'Entrada')}${leg('', '#3b82f6', 'Investimento')}
      <span>${ic('wallet', 13, 2.2)}Salário</span><span>${ic('card', 13, 2.2)}Fatura (dia ${CARTAO_VENCIMENTO})</span>
      <span><i class="bg" style="background:var(--warn-soft)"></i>Saldo abaixo de ${fmtBRL(RESERVA_MINIMA)}</span><span><i class="bg" style="background:var(--neg-soft)"></i>Saldo negativo</span></div>`;
}
function diaHTML(){
  const g = lancDoMes(), d = diaAtual(g), itens = g[d] || [], saldo = saldosDoMes([d])[d];
  const linhas = S.filtroCat ? itens : agruparFaturas(itens);
  const tit = cap(new Date(d + 'T12:00').toLocaleDateString('pt-BR', { weekday:'short', day:'numeric', month:'short' }).replace(/\./g, ''));
  return `<div class="dia-head"><h2>${tit}</h2>${saldo != null ? `<span class="small muted">saldo ao fim do dia <b style="color:var(--text)">${fmtBRL(saldo)}</b></span>` : ''}</div>
    ${itens.length ? `<ul class="list" style="margin-top:4px">${linhas.map(r => linhaHTML(r, { pagar: true, semData: true })).join('')}</ul>`
      : `<div class="empty" style="padding:18px 0 8px">Nenhum lançamento neste dia.</div>`}`;
}
function selDia(d){ S.diaSel = d; $('#calBox').innerHTML = calendarioHTML(); $('#diaBox').innerHTML = diaHTML(); }

/* Busca: só a lista é refeita; a tela inteira só quando a busca começa ou termina (mostra/esconde o mês) */
function aoBuscar(input){
  const antes = !!S.busca.trim(); S.busca = input.value;
  if (antes === !!S.busca.trim()) return void ($('#listaCorpo').innerHTML = listaCorpoHTML());
  const pos = input.selectionStart; render();
  const b = $('#busca'); b.focus(); try { b.setSelectionRange(pos, pos); } catch(e){}
}
function navMes(mes){
  return `<div class="monthnav"><button class="iconbtn" aria-label="Mês anterior" ${mes <= S.mesMin ? 'disabled' : ''} onclick="S.mes=addMes(S.mes,-1);render()">${ic('left',19)}</button><strong>${nomeMes(mes)}</strong><button class="iconbtn" aria-label="Próximo mês" onclick="S.mes=addMes(S.mes,1);render()">${ic('right',19)}</button></div>`;
}
/* Barras por categoria; com limites, a barra mostra quanto do limite foi usado (amarelo ≥ 90%, vermelho acima) */
function barras(porCat, lim = {}, clicavel = false){
  const cats = [...new Set([...Object.keys(porCat), ...Object.keys(lim)])];
  const max = Math.max(1, ...cats.map(c => porCat[c] || 0));
  return cats.sort((a,b) => (porCat[b]||0) - (porCat[a]||0)).map(c => {
    const g = porCat[c] || 0, L = lim[c];
    const pct = L ? g / L * 100 : g / max * 100;
    const cls = L ? (g > L ? 'bad' : g >= 0.9 * L ? 'warn' : '') : '';
    return `<div class="b" style="--c:${corCat(c)};${clicavel ? 'cursor:pointer' : ''}" ${clicavel ? `onclick="S.filtroCat='${esc(c)}';S.busca='';irPara('lista')"` : ''}>
      <div class="t"><span><i></i>${esc(c)}</span><b class="${cls==='bad'?'neg':''}">${fmtBRL(g)}${L ? ` <span class="muted small" style="font-weight:500">de ${fmtBRL(L)}</span>` : ''}</b></div>
      <div class="track"><div class="fill ${cls}" style="width:${Math.min(100, Math.max(2, pct))}%"></div></div></div>`;
  }).join('');
}
function tabelaCatMes(meses){
  const cats = [...new Set(meses.flatMap(m => Object.keys(resumoMes(m).porCat)))].sort();
  const semRS = v => fmtBRL(v).replace('R$ ','');
  return `<table class="t"><thead><tr><th>Categoria</th>${meses.map(m => `<th>${mesAbrev(m)}</th>`).join('')}<th>Total</th></tr></thead><tbody>
  ${cats.map(c => { const vs = meses.map(m => resumoMes(m).porCat[c] || 0); return `<tr><td>${esc(c)}</td>${vs.map(v => `<td>${v ? semRS(v) : '–'}</td>`).join('')}<td><b>${semRS(vs.reduce((a,b)=>a+b,0))}</b></td></tr>`; }).join('')}
  </tbody></table>`;
}

/* ---- gráficos ---- */
function corVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const tooltipBRL = { padding:10, cornerRadius:10, callbacks:{ label: x => `${x.dataset.label}: ${fmtBRL(x.parsed.y)}` } };

  home(){

    const ini = [isoLocal(new Date(Date.now() - 30*864e5)), prim].sort()[1], fim = ultimoDiaMes(addMes(ym(hoje), 1));
    const proxDia = d => isoLocal(new Date(new Date(d + 'T12:00').getTime() + 864e5));
    const dias = []; for (let d = ini; d <= fim; d = proxDia(d)) dias.push(d);
    const saldos = saldosDoMes(dias), valores = dias.map(d => saldos[d]);
    const doDia = {}; c.ord.forEach(r => (doDia[r.data] = doDia[r.data] || []).push(r));
    const idxHoje = dias.indexOf(hoje);
    const brand = corVar('--brand'), muted = corVar('--muted'), line = corVar('--line'), warn = corVar('--warn'), neg = corVar('--neg');
    const corDe = v => v < 0 ? neg : v < RESERVA_MINIMA ? warn : brand;
    const area = ({ chart }) => { const a = chart.chartArea; if (!a) return 'transparent';
      const g = chart.ctx.createLinearGradient(0, a.top, 0, a.bottom); g.addColorStop(0, brand + '30'); g.addColorStop(1, brand + '00'); return g; };
    const linhaHoje = { id:'hoje', afterDatasetsDraw(ch){ if (idxHoje < 0) return; const x = ch.scales.x.getPixelForValue(idxHoje), { top, bottom } = ch.chartArea, k = ch.ctx;
      k.save(); k.strokeStyle = muted; k.globalAlpha = .6; k.setLineDash([3,3]); k.beginPath(); k.moveTo(x, top); k.lineTo(x, bottom); k.stroke();
      k.globalAlpha = 1; k.setLineDash([]); k.fillStyle = muted; k.font = '600 11px Inter, system-ui'; k.textAlign = 'center'; k.fillText('hoje', x, top - 4); k.restore(); } };
    const tituloDia = d => cap(new Date(d + 'T12:00').toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short' }).replace(/\./g, ''));
    charts.saldo = new Chart($('#chSaldo'), {
      type:'line',
      data:{ labels: dias.map(fmtData), datasets:[
        { label:'Saldo', data: valores, stepped: 'after', borderWidth: 2.5, fill: true, backgroundColor: area, spanGaps: false,
          borderColor: brand,
          segment: { // passado contínuo, futuro tracejado; amarelo abaixo da reserva, vermelho negativo
            borderDash: s => s.p0DataIndex >= idxHoje && idxHoje >= 0 ? [5, 4] : undefined,
            borderColor: s => corDe(Math.min(s.p0.parsed.y, s.p1.parsed.y)) },
          pointRadius: dias.map(d => doDia[d] ? 3 : 0), pointHoverRadius: 5,
          pointBackgroundColor: valores.map(v => v == null ? brand : corDe(v)), pointBorderWidth: 0 },
        { label:'Reserva', data: dias.map(() => RESERVA_MINIMA), borderColor: muted, borderWidth: 1, borderDash: [2, 3], pointRadius: 0, pointHoverRadius: 0, fill: false }
      ]},
      plugins:[linhaHoje],
      options:{ maintainAspectRatio:false, interaction:{ mode:'index', intersect:false }, layout:{ padding:{ top:18 } },
        plugins:{ legend:{ display:false },
          tooltip:{ ...tooltipBRL, displayColors:false, filter: x => x.datasetIndex === 0 && x.parsed.y != null,
            callbacks:{
              title: x => tituloDia(dias[x[0].dataIndex]),
              label: x => `Saldo ao fim do dia: ${fmtBRL(x.parsed.y)}`,
              afterBody: x => { const it = doDia[dias[x[0].dataIndex]] || [];
                return it.slice(0, 5).map(r => `${sinal(r.tipo) > 0 ? '+' : '−'}${fmtBRL(r.valor)}  ${r.desc}${r.status !== 'Pago' ? ` (${r.status.toLowerCase()})` : ''}`)
                  .concat(it.length > 5 ? [`+ ${it.length - 5} lançamento(s)`] : []); } } } },
        scales:{ x:{ ticks:{ color:muted, maxTicksLimit:7, maxRotation:0, autoSkipPadding:12, font:{ size:11 } }, grid:{ display:false }, border:{ display:false } },
                 y:{ suggestedMin: 0, ticks:{ color:muted, maxTicksLimit:5, font:{ size:11 }, callback:compacto }, grid:{ color:line }, border:{ display:false } } } }
    });
  },
  analise(){
    if (!window.Chart) return;
    const meses = mesesComDados(), rs = meses.map(resumoMes), muted = corVar('--muted');
    const barra = { borderRadius:6, maxBarThickness:22 };
    charts.meses = new Chart($('#chMeses'), {
      type:'bar',
      data:{ labels: meses.map(mesAbrev), datasets:[
        { ...barra, label:'Entradas', data: rs.map(r => r.ent), backgroundColor: corVar('--pos') },
        { ...barra, label:'Saídas', data: rs.map(r => r.sai), backgroundColor: corVar('--neg') }
      ]},
      options:{ maintainAspectRatio:false, plugins:{ legend:{ position:'top', align:'start', labels:{ color:muted, boxWidth:10, boxHeight:10, useBorderRadius:true, borderRadius:3, font:{ size:12 } } }, tooltip:tooltipBRL },
        scales:{ x:{ ticks:{ color:muted }, grid:{ display:false }, border:{ display:false } }, y:{ ticks:{ color:muted, maxTicksLimit:5, callback:compacto }, grid:{ color:corVar('--line') }, border:{ display:false } } } }
    });
  }
};

/* ============================== janelas ============================== */
function abrirSheet(html){
  fecharSheet();
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="sheet">${html}</div>`; document.body.appendChild(bg); return bg;
}
const fecharSheet = () => $('#sheet')?.remove();
const cabecalho = titulo => `<h3>${titulo}<button class="iconbtn plain" aria-label="Fechar" onclick="fecharSheet()">${ic('x',20)}</button></h3>`;

/* ---- formulário de lançamento (estado do formulário aberto fica em F) ---- */
let F = {};
function abrirForm(rowNum, prefill){
  if (rowNum < 0) return toast('Este lançamento está guardado no aparelho e vai para a planilha quando houver internet.', 4000);
  const ed = rowNum ? linha(rowNum) : null;
  const l = ed ? { ...ed } : { data: today(), desc:'', cat:'', tipo:'Saída', forma:'Débito', status:'Pago', valor:'', obs:'', rec:'Única', ...(prefill || {}) };
  const parcAtual = ed ? parcela(ed.desc) : null; // editando algo que já é uma parcela ("MBA 2/12")
  if (parcAtual && !l.rec) l.rec = 'Parcelada';
  // novo lançamento sem tipo definido: primeiro escolhe o tipo (editar, duplicar etc. já vêm com o tipo)
  const escolher = !ed && !prefill?.tipo;
  F = { ed, tipo: l.tipo, modo: null, parcInfo: null };
  const descs = [...new Set(S.rows.map(r => r.desc).filter(Boolean))].sort((a,b) => a.localeCompare(b,'pt-BR'));
  const bg = abrirSheet(`${cabecalho(ed ? 'Editar lançamento' : 'Novo lançamento')}
    <div id="tipoGrid" style="display:${escolher ? '' : 'none'}">
      <p class="small muted" style="margin:-6px 0 12px">O que você quer lançar?</p>
      <div class="tipos">${TIPOS.map(t => { const [cls, i, txt] = TIPO_VISUAL[t]; return `<button type="button" class="tipo-tile ${cls}" onclick="escolherTipo('${t}')"><span class="ti">${ic(i, 22, 2.2)}</span><b>${t}</b><small>${txt}</small></button>`; }).join('')}</div>
    </div>
    <div id="formCorpo" style="display:${escolher ? 'none' : ''}">
    <button type="button" class="tipochip" id="tipoChip" onclick="mostrarTipos()" aria-label="Trocar o tipo do lançamento"></button>
    ${ed && ed.status === 'Previsão' ? `<button class="btn block" style="margin:8px 0 6px" onclick="abrirRegistro(${ed.row})">${ic('check', 18, 2.4)}Registrar pagamento desta previsão</button>` : ''}
    <div class="valorbox"><span>R$</span><input class="i valor" id="fValor" inputmode="decimal" placeholder="0,00" aria-label="Valor" value="${l.valor !== '' ? numBR(l.valor) : ''}"></div>
    <label class="f"><span>Descrição</span><input class="i" id="fDesc" list="dlDesc" autocomplete="off" value="${esc(l.desc)}"><datalist id="dlDesc">${descs.map(d => `<option value="${esc(d)}">`).join('')}</datalist></label>
    <div class="row">
      <label class="f"><span>Categoria</span><select class="i" id="fCat"><option value="">Escolha…</option>${opt(CATEGORIAS.includes(l.cat) || !l.cat ? CATEGORIAS : [...CATEGORIAS, l.cat], l.cat)}</select></label>
      <label class="f"><span>Forma</span><select class="i" id="fForma">${opt(FORMAS, l.forma)}</select></label>
    </div>
    <div class="row">
      <label class="f" id="boxData"><span>Data</span><input class="i" type="date" id="fData" value="${l.data}"></label>
      <label class="f" id="boxMes" style="display:none"><span id="lblMes">Mês</span><select class="i" id="fMes">${opcoesMes(l.data)}</select></label>
      <label class="f"><span>Status</span><select class="i" id="fStatus">${opt(STATUS.includes(l.status) ? STATUS : [...STATUS, l.status], l.status)}</select></label>
    </div>
    <label class="f"><span>Observação (opcional)</span><input class="i" id="fObs" value="${esc(l.obs)}"></label>
    <span class="lbl">Esse lançamento é</span>
    <div class="seg" id="segRec">${[['Única','Única vez'],['Recorrente','Todo mês'],['Parcelada','Parcelado']].map(([v, n]) => `<button type="button" class="${v === l.rec ? 'on' : ''}" data-v="${v}">${n}</button>`).join('')}</div>
    ${parcAtual ? `<div id="parcAtual" class="small muted" style="display:${l.rec === 'Parcelada' ? '' : 'none'};margin:-4px 0 12px">Esta é a parcela ${parcAtual.atual} de ${parcAtual.total}. As outras parcelas são lançamentos separados e não são alteradas aqui.</div>`
    : `<div id="parcBox" style="display:${ed && l.rec === 'Parcelada' ? '' : 'none'}"><div class="row">
      <label class="f"><span>Nº de parcelas</span><input class="i" id="fNParc" type="number" min="2" max="60" value="2" inputmode="numeric"></label>
      <label class="f"><span>O valor digitado é</span><select class="i" id="fParcModo"><option value="parcela">de cada parcela</option><option value="total">o total da compra</option></select></label>
    </div><div id="parcInfo" class="small muted" style="margin:-4px 0 10px"></div></div>`}
    <div class="row" style="margin-top:6px">

      <button class="btn" id="fSalvar" onclick="salvar(${ed ? ed.row : 0})">${ed ? 'Salvar alterações' : 'Lançar'}</button>
    </div>

    </div>`);
  bg.querySelectorAll('#segRec button').forEach(b => b.onclick = () => setRec(b.dataset.v));
  $('#fCat').addEventListener('change', () => F.catSugerida = false);

  $('#fStatus').addEventListener('change', () => atualizarModoData());

  $('#fData').addEventListener('change', e => { if (!ed) $('#fStatus').value = statusPorData(e.target.value); });
  $('#fDesc').addEventListener('change', e => {
    if (ed) return;
    const ult = [...S.rows].reverse().find(r => r.desc.toLowerCase() === e.target.value.trim().toLowerCase());
    if (!ult) return;
    $('#fCat').value = ult.cat; $('#fForma').value = ult.forma;
    setTipoForm(ult.tipo);
    if (ult.rec === 'Recorrente' || ult.rec === 'Única') setRec(ult.rec);
    if (!$('#fValor').value) $('#fValor').value = numBR(ult.valor);
    atualizarModoData();
  });
  if (!parcAtual){
    F.parcInfo = () => {
      if (segAtual('segRec') !== 'Parcelada') return;
      const lst = gerarParcelas(lerForm(), parseInt($('#fNParc').value, 10), $('#fParcModo').value);
      $('#parcInfo').textContent = lst ? `${lst.length}× de ${fmtBRL(lst[0].valor)} (total ${fmtBRL(soma(lst))}), de ${fmtDataLonga(lst[0].data)} a ${fmtDataLonga(lst[lst.length-1].data)}. A descrição recebe "1/${lst.length}", "2/${lst.length}"…${ed ? ' Este lançamento vira a parcela 1 e as outras são criadas nos meses seguintes.' : ''}` : 'Informe valor, data e de 2 a 60 parcelas.';
    };
    ['#fNParc','#fParcModo','#fValor','#fData'].forEach(s => $(s).addEventListener('input', () => F.parcInfo()));
  }
  if (escolher) atualizarModoData(true);
  else { setTipoForm(l.tipo); if (!ed) setTimeout(() => $('#fValor')?.focus(), 50); }
