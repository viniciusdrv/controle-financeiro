/* Tipo do lançamento: pinta a janela e ajusta o formulário */
function setTipoForm(t){
  F.tipo = t;
  const [cls, i] = TIPO_VISUAL[t];
  $('#sheet .sheet').className = `sheet tipado ${cls}`;
  $('#tipoChip').innerHTML = `<span class="ti">${ic(i, 15, 2.4)}</span>${t} <small>· trocar</small>`;
  atualizarModoData();
}
function escolherTipo(t){
  setTipoForm(t);
  // sugere categoria e forma; uma sugestão anterior (não escolhida pelo usuário) acompanha a troca de tipo
  if (!$('#fCat').value || F.catSugerida){
    const [cat, forma] = { 'Entrada':['Renda','Conta'], 'Investimento':['Investimento','Conta'], 'Retirada':['Investimento','Conta'] }[t] || ['', 'Débito'];
    $('#fCat').value = cat; $('#fForma').value = forma; F.catSugerida = !!cat;
    atualizarModoData();
  }
  $('#tipoGrid').style.display = 'none'; $('#formCorpo').style.display = '';
  if (!F.ed) setTimeout(() => $('#fValor')?.focus(), 50);
}
function mostrarTipos(){ $('#tipoGrid').style.display = ''; $('#formCorpo').style.display = 'none'; }
function opcoesMes(sel){
  const base = ym(today()), meses = [];
  for (let k = -3; k <= 14; k++){ const m = addMes(base, k); if (m >= S.mesMin) meses.push(m); }
  if (sel && !meses.includes(ym(sel))) meses.push(ym(sel));
  return meses.sort().map(m => `<option value="${m}" ${sel && ym(sel) === m ? 'selected' : ''}>${mesAbrev(m)} ${m.slice(0,4)}</option>`).join('');
}
const modoForm = () => modoDe(F.tipo, $('#fForma').value, $('#fStatus').value);
/* Troca o campo de data conforme o modo e, ao mudar de modo, sugere um mês/data coerente */
function atualizarModoData(inicio){
  const modo = modoForm(), antes = F.modo; F.modo = modo;
  $('#boxData').style.display = modo === 'dia' ? '' : 'none';
  $('#boxMes').style.display = modo === 'dia' ? 'none' : '';
  $('#lblMes').textContent = modo === 'fatura' ? 'Fatura de' : 'Mês da previsão';
  if (modo === antes) return;
  if (modo === 'fatura'){
    // novo lançamento: sugere a fatura pela regra do melhor dia; editando: mantém o mês do lançamento
    $('#fMes').value = F.ed ? ym(F.ed.data) : faturaSugerida($('#fData').value || today());
    if (!F.ed && $('#fStatus').value !== 'Previsão') $('#fStatus').value = statusPorData(dataFatura($('#fMes').value));
  } else if (modo === 'mes' && !inicio){
    $('#fMes').value = ym($('#fData').value || today());
  } else if (modo === 'dia' && antes === 'mes' && !inicio){
    // saindo de "previsão": parte do mês que estava escolhido (o mês da fatura não é data de compra, então nesse caso a data fica como estava)
    const m = $('#fMes').value; if (ym($('#fData').value) !== m) $('#fData').value = m === ym(today()) ? today() : `${m}-01`;
  }
  F.parcInfo?.();
}
function setRec(v){
  marcarSeg('segRec', v);
  const box = $('#parcBox'); if (box){ box.style.display = v === 'Parcelada' ? '' : 'none'; F.parcInfo?.(); }
  const atual = $('#parcAtual'); if (atual) atual.style.display = v === 'Parcelada' ? '' : 'none';
}
function lerForm(){
  return {
    rec: segAtual('segRec'), tipo: F.tipo,
    valor: parseValor($('#fValor').value), desc: $('#fDesc').value.trim(),
    data: resolverData({ modo: modoForm(), dia: $('#fData').value, mes: $('#fMes').value, original: F.ed?.data }),
    cat: $('#fCat').value, forma: $('#fForma').value, status: $('#fStatus').value, obs: $('#fObs').value.trim()
  };
}
function gerarParcelas(l, n, modo){
  if (!(n >= 2 && n <= 60) || !(l.valor > 0) || !l.data) return null;
  const total = Math.round(l.valor * 100) * (modo === 'total' ? 1 : n);
  const base = Math.floor(total / n), resto = total - base * n;
  return Array.from({ length: n }, (_, i) => ({
    ...l, desc: comParcela(l.desc, i + 1, n), data: mesesDepois(l.data, i),
    valor: (base + (i === n - 1 ? resto : 0)) / 100,
    status: i === 0 ? l.status : 'Programado'
  }));
}
const lancarInvestimento = valor => abrirForm(0, { tipo: 'Investimento', desc: 'Investimento', cat: 'Investimento', forma: 'Conta', valor, rec: 'Única' });
function duplicar(rowNum){
  const r = linha(rowNum); if (!r) return;
  abrirForm(0, { desc: baseDesc(r.desc), cat: r.cat, tipo: r.tipo, forma: r.forma, valor: r.valor, obs: r.obs, status: 'Pago', rec: r.rec === 'Recorrente' ? 'Recorrente' : 'Única' });
}
async function salvar(rowNum){
  const l = lerForm();
  if (!(l.valor > 0)) return toast('Informe um valor válido');
  if (!l.desc) return toast('Informe a descrição');
  if (!l.data) return toast('Informe a data');
  if (!l.cat) return toast('Escolha a categoria');
  let lista = [l];
  // novo lançamento parcelado, ou um lançamento comum sendo transformado em parcelado (o parcBox só existe nesses casos)
  if (l.rec === 'Parcelada' && $('#parcBox')){
    lista = gerarParcelas(l, parseInt($('#fNParc').value, 10), $('#fParcModo').value);
    if (!lista) return toast('Informe de 2 a 60 parcelas');
  }
  await comBotao('#fSalvar', 'Salvando…', async () => {
    let guardado = false;
    if (rowNum){
      // a linha editada recebe a 1ª parcela (ou o próprio lançamento); as demais parcelas entram como novas
      await db().atualizar(rowNum, lista[0]);
      if (lista.length > 1) guardado = await inserirNovos(lista.slice(1));
    } else guardado = await inserirNovos(lista);
    fecharSheet();
    toast(guardado ? 'Sem internet: guardado no aparelho, será enviado à planilha depois'
      : rowNum ? (lista.length > 1 ? `Transformado em ${lista.length} parcelas ✓` : 'Alterações salvas ✓')
      : lista.length > 1 ? `${lista.length} parcelas lançadas ✓` : 'Lançado ✓', guardado ? 4500 : 2600);
    render();
  });
}
async function excluir(rowNum){
  const r = linha(rowNum); if (!r) return;
  if (!confirm(`Excluir "${r.desc}" de ${fmtDataLonga(r.data)} (${fmtBRL(r.valor)})?\nA linha ${rowNum} será esvaziada na planilha.`)) return;
  try { await db().limpar(rowNum); fecharSheet(); toast('Excluído'); render(); }
  catch(e){ toast('Erro: ' + e.message, 5000); }
}
async function marcarPago(rowNum){
  const r = linha(rowNum); if (!r) return;
  try { await db().marcarPago(rowNum); toast(`"${r.desc}" marcado como pago ✓`); render(); }
  catch(e){ toast('Erro: ' + e.message, 5000); }
}

/* ---- programar o próximo mês ---- */
let PROG = [];
function abrirProgramar(orig){
  const dest = addMes(orig, 1);
  const noDestino = new Set(S.rows.filter(r => r.data && ym(r.data) === dest).map(r => r.desc.trim().toLowerCase()));
  const meses = {}; S.rows.forEach(r => { if (!r.data) return; const k = baseDesc(r.desc).toLowerCase(); (meses[k] = meses[k] || new Set()).add(ym(r.data)); });
  PROG = S.rows.filter(r => r.data && ym(r.data) === orig && !r.pendente && r.status !== 'Marco zero').sort(porData).map(r => {
    const p = parcela(r.desc);
    let desc = r.desc, nota = '';
    if (p){ if (p.atual >= p.total) nota = 'última parcela'; else desc = comParcela(p.base, p.atual + 1, p.total); }
    if (!nota && noDestino.has(desc.trim().toLowerCase())) nota = `já existe em ${mesAbrev(dest)}`;
    // marcação explícita (coluna Recorrência) manda; sem marcação, deduz pelo histórico
    const recorrente = !!p || r.rec === 'Recorrente' || (!r.rec && (meses[baseDesc(r.desc).toLowerCase()]?.size || 0) >= 2);
    const data = r.status === 'Previsão' ? mesesDepois(r.data, 1) : addMesesData(r.data, 1);
    return { r, desc, parc: !!p, data, nota, marcado: !nota && recorrente };
  });
  abrirSheet(`${cabecalho(`Programar ${nomeMes(dest)}`)}
    <p class="small muted" style="margin-top:0">Copia lançamentos de ${nomeMes(orig)} para o mês seguinte como <b>Programado</b> (ou Previsão). Já vêm marcados os que se repetem em outros meses e as parcelas, que avançam para a próxima (ex.: 2/12 → 3/12). Ajuste valores se precisar.</p>
    ${PROG.length ? `<div class="row" style="margin-bottom:6px"><button class="btn sec sm" onclick="marcarProg(true)">Marcar todos</button><button class="btn sec sm" onclick="marcarProg(false)">Desmarcar todos</button></div>
    <ul class="list card" style="padding:4px 12px">${PROG.map((x, i) => `<li class="item ${x.nota ? 'off' : ''}" style="cursor:default">
      <input type="checkbox" class="progchk" data-i="${i}" ${x.marcado ? 'checked' : ''} ${x.nota ? 'disabled' : ''} onchange="contarProg()">
      <div class="main"><div class="d">${esc(x.desc)}</div><div class="s">${fmtData(x.data)} · ${esc(x.r.cat)} · ${esc(x.r.forma)}${x.r.rec === 'Única' && !x.parc ? ' · única vez' : ''}${x.nota ? ` · <b>${x.nota}</b>` : ''}</div></div>
      <input class="i mini" id="progv${i}" inputmode="decimal" value="${numBR(x.r.valor)}" ${x.nota ? 'disabled' : ''}></li>`).join('')}</ul>
    <button class="btn block" id="progBtn" onclick="salvarProgramacao()"></button>` : '<div class="empty">Nenhum lançamento neste mês para copiar.</div>'}`);
  contarProg();
}
function marcarProg(sim){ document.querySelectorAll('.progchk:not(:disabled)').forEach(c => c.checked = sim); contarProg(); }
function contarProg(){ const n = document.querySelectorAll('.progchk:checked').length, b = $('#progBtn'); if (b){ b.textContent = n ? `Programar ${n} lançamento(s)` : 'Nada marcado'; b.disabled = !n; } }
async function salvarProgramacao(){
  const lista = [];
  for (const c of document.querySelectorAll('.progchk:checked')){
    const x = PROG[+c.dataset.i], v = parseValor($('#progv' + c.dataset.i).value);
    if (!(v > 0)) return toast(`Valor inválido em "${x.desc}"`);
    lista.push({ data: x.data, desc: x.desc, cat: x.r.cat, tipo: x.r.tipo, forma: x.r.forma, status: x.r.status === 'Previsão' ? 'Previsão' : 'Programado', valor: v, obs: x.r.obs || '', rec: x.parc ? 'Parcelada' : 'Recorrente' });
  }
  await comBotao('#progBtn', 'Gravando…', async () => {
    const guardado = await inserirNovos(lista);
    fecharSheet(); S.mes = ym(lista[0].data); render();
    toast(guardado ? 'Sem internet: guardados no aparelho, serão enviados depois' : `${lista.length} lançamento(s) programado(s) ✓`, 3500);
  });
}

/* ---- registrar gasto de uma previsão: valor real, total ou parcial ---- */
function abrirRegistro(rowNum){
  const r = linha(rowNum); if (!r) return;
  abrirSheet(`${cabecalho('Registrar gasto')}
    <div class="item" style="cursor:default;padding-top:0;border-bottom:0">${avatar(r.cat)}<div class="main"><div class="d">${esc(r.desc)}</div>
      <div class="s">Previsto ${fmtBRL(r.valor)} · ${esc(quando(r))}</div></div></div>
    <span class="lbl" style="text-align:center">Quanto foi pago?</span>
    <div class="valorbox" style="padding-top:2px"><span>R$</span><input class="i valor" id="rValor" inputmode="decimal" aria-label="Valor pago" value="${numBR(r.valor)}"></div>
    <div class="row">
      ${ehCartao(r) ? `<label class="f"><span>Fatura de</span><select class="i" id="rMes">${opcoesMes(r.data)}</select></label>`
                    : `<label class="f"><span>Data do gasto</span><input class="i" type="date" id="rData" value="${today()}"></label>`}
      <label class="f"><span>Forma</span><select class="i" id="rForma">${opt(FORMAS, r.forma)}</select></label>
    </div>
    <div id="rResto" style="display:none">
      <span class="lbl" id="rRestoTxt"></span>
      <div class="seg" id="segResto"><button type="button" class="on" data-v="manter">Manter o restante previsto</button><button type="button" data-v="encerrar">Encerrar previsão</button></div>
    </div>
    <button class="btn block" id="rBtn" onclick="salvarRegistro(${r.row})">${ic('check', 18, 2.4)}Registrar pagamento</button>`);
  $('#rValor').addEventListener('input', () => {
    const resto = Math.round((r.valor - parseValor($('#rValor').value)) * 100) / 100, mostra = resto > 0.004 && resto < r.valor;
    $('#rResto').style.display = mostra ? '' : 'none';
    if (mostra) $('#rRestoTxt').textContent = `Sobram ${fmtBRL(resto)} da previsão. O que fazer com o restante?`;
  });
  document.querySelectorAll('#segResto button').forEach(b => b.onclick = () => marcarSeg('segResto', b.dataset.v));
  setTimeout(() => { const i = $('#rValor'); if (i){ i.focus(); i.select(); } }, 80);
}
async function salvarRegistro(rowNum){
  const r = linha(rowNum); if (!r) return;
  const v = parseValor($('#rValor').value);
  if (!(v > 0)) return toast('Informe o valor pago');
  const forma = $('#rForma').value;
  // mesma regra do formulário: no cartão vai para a fatura (sugerida pela data, se antes era débito); fora do cartão, a data do gasto
  const dia = $('#rData')?.value || today();
  const data = resolverData({ modo: modoDe(r.tipo, forma, 'Pago'), dia, mes: $('#rMes')?.value || faturaSugerida(dia) });
  const resto = Math.round((r.valor - v) * 100) / 100;
  const manter = resto > 0.004 && segAtual('segResto') === 'manter';
  const { row, saldo, pendente, ...base } = r;
  const pago = { ...base, valor: v, data, forma, status: statusPorData(data) };
  await comBotao('#rBtn', 'Registrando…', async () => {
    let guardado = false;
    if (manter){
      // a previsão continua com o que sobrou; o gasto entra como um lançamento novo, de uma vez só
      await db().atualizar(rowNum, { ...base, valor: resto });
      guardado = await inserirNovos([{ ...pago, rec: 'Única', obs: '' }]);
    } else await db().atualizar(rowNum, pago);
    fecharSheet(); render();
    toast(guardado ? 'Sem internet: guardado no aparelho, será enviado depois'
      : manter ? `Registrado ${fmtBRL(v)} · ainda previstos ${fmtBRL(resto)}` : `${r.desc}: ${fmtBRL(v)} registrado ✓`, 3500);
  });
}

/* ---- fatura do cartão no mês ---- */
function abrirFatura(mes){
  const rs = S.rows.filter(r => r.data && ym(r.data) === mes && ehCartao(r)).sort(porData);
  const tot = resumoMes(mes).cartao, pago = soma(rs.filter(r => r.status === 'Pago')), ant = resumoMes(addMes(mes, -1)).cartao;
  const porCat = {}; rs.forEach(r => porCat[r.cat] = (porCat[r.cat] || 0) + r.valor);
  const pendentes = rs.filter(r => r.status !== 'Pago' && !r.pendente);
  abrirSheet(`${cabecalho(`Cartão · ${nomeMes(mes)}`)}
    <div class="kpis">
      <div class="kpi big"><div class="l">Total no mês (${rs.length} lançamentos)</div><div class="v">${fmtBRL(tot)}</div>
        <div class="small muted">${ant ? `Mês anterior: ${fmtBRL(ant)} (${tot >= ant ? '+' : '−'}${fmtBRL(Math.abs(tot - ant))})` : ''}</div></div>
      <div class="kpi"><div class="l">Pago</div><div class="v">${fmtBRL(pago)}</div></div>
      <div class="kpi"><div class="l">Programado / previsto</div><div class="v">${fmtBRL(tot - pago)}</div></div>
    </div>
    ${rs.length ? `<div class="card"><h2>Por categoria</h2><div class="bars">${barras(porCat)}</div></div>
    ${pendentes.length ? `<button class="btn block" style="margin-bottom:14px" onclick="pagarFatura('${mes}')">${ic('check', 18, 2.4)}Marcar fatura como paga (${fmtBRL(soma(pendentes))})</button>` : ''}
    <div class="card" style="padding:2px 14px"><ul class="list">${rs.map(r => itemHTML(r)).join('')}</ul></div>` : '<div class="empty">Nenhuma compra no cartão neste mês.</div>'}
    <p class="small muted">Toque numa compra para editar ou excluir. Considera as saídas com forma "Cartão" pela data lançada, igual ao quadro CARTÃO do Dashboard.</p>`);
}
/* marca como pagas todas as compras ainda pendentes da fatura do mês */
async function pagarFatura(mes){
  const pend = S.rows.filter(r => r.data && ym(r.data) === mes && ehCartao(r) && r.status !== 'Pago' && !r.pendente);
  if (!pend.length) return;
  if (!confirm(`Marcar as ${pend.length} compra(s) da fatura de ${mesLongo(mes).toLowerCase()} como pagas (${fmtBRL(soma(pend))})?`)) return;
  try {
    for (const r of pend) await db().marcarPago(r.row);
    fecharSheet(); toast(`Fatura de ${mesLongo(mes).toLowerCase()} marcada como paga ✓`); render();
  } catch(e){ toast('Erro: ' + e.message, 5000); render(); }
}

/* ---- limites por categoria ---- */
function abrirLimites(){
  if (!temAbaLimites()){
    abrirSheet(`${cabecalho('Limites por categoria')}
      <p>Defina quanto quer gastar por mês em cada categoria. O app avisa quando chegar a 90% e quando passar.</p>
      <p class="small muted">Para os limites valerem no PC e no celular, o app vai criar uma aba <b>"Limites"</b> na sua planilha, com: Categoria, Limite mensal, Previsto no mês atual e Disponível. Você também pode editar os limites direto nessa aba.</p>
      <button class="btn block" id="limCriar" onclick="criarLimitesUI()">Criar aba Limites na planilha</button>`);
    return;
  }
  const gasto = resumoMes(ym(today())).porCat;
  abrirSheet(`${cabecalho('Limites mensais')}
    <p class="small muted" style="margin-top:0">Deixe em branco a categoria sem limite. Abaixo de cada uma, o previsto para ${mesLongo(ym(today())).toLowerCase()} (pago + programado).</p>
    <ul class="list card" style="padding:2px 14px">${Object.keys(S.limitesRow).map(c => `<li class="item" style="cursor:default">${avatar(c)}<div class="main"><div class="d">${esc(c)}</div><div class="s">previsto ${fmtBRL(gasto[c] || 0)}</div></div>
      <input class="i mini limv" data-c="${esc(c)}" inputmode="decimal" placeholder="sem limite" value="${S.limites[c] ? numBR(S.limites[c]) : ''}"></li>`).join('')}</ul>
    <button class="btn block" id="limBtn" onclick="salvarLimitesUI()">Salvar limites</button>`);
}
async function criarLimitesUI(){
  await comBotao('#limCriar', 'Criando aba…', async () => { await criarAbaLimites(); await carregarLimites(); salvarCache(); toast('Aba "Limites" criada ✓'); abrirLimites(); });
}
async function salvarLimitesUI(){
  const valores = {};
  for (const i of document.querySelectorAll('.limv')){
    const t = i.value.trim(); if (!t){ valores[i.dataset.c] = ''; continue; }
    const v = parseValor(t); if (!(v > 0)) return toast(`Limite inválido em ${i.dataset.c}`);
    valores[i.dataset.c] = v;
  }
  await comBotao('#limBtn', 'Salvando…', async () => { await db().salvarLimites(valores); fecharSheet(); toast('Limites salvos ✓'); render(); });
}

/* ============================== ajustes, login, início ============================== */
function abrirConfig(){
  const conta = msalApp?.getActiveAccount();
  abrirSheet(`${cabecalho('Ajustes')}
    ${S.mode === 'graph' ? `<div class="card"><div class="small muted">Conectado como</div><div style="font-weight:650;margin:2px 0 10px">${esc(conta?.username || '')}</div>
      <div class="small muted">OneDrive${esc(FILE_PATH)}<br>${S.rows.length} lançamentos · ${S.emptyRows.length} linhas livres na tabela</div></div>
      <button class="btn sec block" style="margin-bottom:10px" onclick="abrirLimites()">${ic('target',17)}Limites por categoria</button>
      <button class="btn sec block" onclick="sair()">Sair da conta</button>` :
      `<div class="card">Você está no modo demonstração.</div><button class="btn block" onclick="lsSet('cf_demo',null);location.reload()">Conectar à minha planilha</button>`}
    <span class="lbl" style="margin-top:18px">Tema neste aparelho</span>
    <div class="seg" id="segTema">${[['auto','Automático'],['light','Claro'],['dark','Escuro']].map(([v, n]) => `<button type="button" class="${(lsGet('cf_tema') || 'auto') === v ? 'on' : ''}" data-v="${v}" onclick="setTema('${v}')">${n}</button>`).join('')}</div>
    <p class="small muted" style="margin-top:-4px">Automático segue o modo claro/escuro do celular ou do computador.</p>
    <p class="small muted" style="margin-top:16px">Os lançamentos são gravados direto na aba ${esc(S.sheetName)} (Tabela1). Fórmulas como "Saldo projetado" e "Categoria Dashboard" continuam sendo calculadas pelo Excel.</p>`);
}
function setTema(v){
  lsSet('cf_tema', v === 'auto' ? null : v);
  aplicarTema(); marcarSeg('segTema', v);
  render(); // redesenha os gráficos com as cores do tema
}
async function sair(){ ['cf_tab','cf_cache','cf_itemId'].forEach(k => lsSet(k, null)); await msalApp.logoutRedirect({ account: msalApp.getActiveAccount() }); }
async function recarregar(){
  if (S.mode !== 'graph') return toast('Modo demonstração');
  S.loading = true; render();
  let ok = false;
  try { await carregarTudo(); ok = true; }
  catch(e){ if (S.bloqueioExcel) await garantirWebUrl().catch(() => {}); else toast(isOffline(e) ? 'Sem internet — mostrando os dados guardados' : 'Erro: ' + e.message, 5000); }
  S.loading = false; render();
  if (ok) enviarFila(true);
}
function telaInicial(msg){
  $('#root').innerHTML = `<div class="wrap"><div class="login">
    <img src="icon.svg" alt=""><h1>Controle Financeiro</h1>
    ${msg ? `<div class="alert" style="text-align:left">${ic('alert',18)}<span>${esc(msg)}</span></div>` : ''}
    <p class="muted" style="margin:0">Entre com a conta Microsoft onde está a planilha <b>Controle Financeiro.xlsx</b>.</p>
    <button class="btn block" onclick="entrar()">Entrar com a conta Microsoft</button>
    <button class="btn sec block" onclick="lsSet('cf_demo','1');location.reload()">Ver demonstração</button>
  </div></div>`;
}
async function entrar(){ await msalApp.loginRedirect({ scopes: SCOPES }); }

(async function main(){
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
  window.aoMudarTema = () => { if (S.mode) render(); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return fecharSheet();
    const digitando = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '');
    if (!digitando && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'n' && !$('#sheet') && S.mode){ e.preventDefault(); abrirForm(); }
  });
  if (lsGet('cf_demo')){
    Object.assign(S, { mode: 'demo', rows: dadosDemo(), limites: { 'Lazer': 300, 'Alimentação': 1200 }, limitesRow: Object.fromEntries(CATS_LIMITE.map((c, i) => [c, i + 2])) });
    return render();
  }
  window.addEventListener('online', () => { if (S.mode === 'graph') recarregar(); });
  if (!window.msal) return telaInicial('Não foi possível carregar a biblioteca de login da Microsoft. Verifique a internet.');
  $('#root').innerHTML = '<div class="center"><div class="spinner"></div><div class="muted">Conectando…</div></div>';
  try {
    if (!await initMsal()) return telaInicial();
    Object.assign(S, { mode: 'graph', mesMin: INICIO_CONTROLE });
    // mostra na hora a última cópia guardada e atualiza com a planilha em seguida
    const cacheDe = restaurarCache();
    if (cacheDe) render(); else $('#root').innerHTML = '<div class="center"><div class="spinner"></div><div class="muted">Lendo a planilha…</div></div>';
    try { await carregarTudo(); }
    catch(e){
      if (!cacheDe) throw e;
      if (isOffline(e)) S.offlineDesde = cacheDe; else if (S.bloqueioExcel) await garantirWebUrl().catch(() => {}); else toast('Erro ao atualizar: ' + e.message, 5000);
    }
    render();
    if (!S.offlineDesde) enviarFila(true);
  } catch(e){
    console.error(e);
    if (S.bloqueioExcel){ await garantirWebUrl().catch(() => {}); return render(); } // mostra o app com o aviso e o botão do Excel online
    telaInicial('Erro: ' + (e.errorMessage ? `${e.errorCode} — ${e.errorMessage}` : e.message));
  }
})();
</script>
